<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>JPRAG Rapport V2</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--danger:#b42318;--ok:#16794a;--soft:#eef2f7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850}.brand small{display:block;color:var(--muted);font-size:11px}.wrap{max-width:820px;margin:auto;padding:14px 14px 60px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.035)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}h2,h3{margin:0 0 10px}button{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;background:#111827;color:#fff;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.ghost{background:#fff;color:#111827;border:1px solid var(--line)}.danger{background:#fee2e2;color:#991b1b}.small{padding:8px 10px;font-size:13px}.full{width:100%}input,select{width:100%;padding:11px 12px;border:1px solid #cfd4dc;border-radius:10px;font:inherit;background:#fff}label{font-size:12px;font-weight:750;color:#4b5563;display:block;margin:8px 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weeknav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-bottom:12px}.weektitle{text-align:center;font-weight:850}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer}.day.active{outline:2px solid #111827}.day .dn{font-size:12px;color:var(--muted)}.hours{font-weight:850;margin-top:4px}.low{color:var(--danger)}.ok{color:var(--ok)}.weekend-remove{position:absolute;right:3px;top:2px;background:transparent;color:#6b7280;padding:2px 5px;font-size:14px}.entry{border-top:1px solid #e5e7eb;padding:12px 0}.entry:first-of-type{border-top:0}.entry-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.entry-name{font-weight:800}.entry-hours{font-weight:850;white-space:nowrap}.taskline{font-size:14px;color:#4b5563;margin-top:4px}.pill{display:inline-block;background:#eef2f7;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:700}.pill.local{background:#fff7ed;color:#9a3412}.totalbar{border-radius:12px;padding:12px 14px;font-size:18px;font-weight:900;display:flex;justify-content:space-between}.totalbar.low{background:#fee2e2;color:#991b1b}.totalbar.ok{background:#dcfce7;color:#166534}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.taskgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.taskbtn{background:#f3f4f6;color:#111827;border:1px solid #d8dee7;text-align:left;padding:10px;font-size:13px}.taskbtn.selected{background:#111827;color:#fff}.taskdetail{background:#f8fafc;border:1px solid #e5e7eb;border-radius:11px;padding:9px;margin-top:7px}.site-search{position:sticky;top:0;background:#fff;padding-bottom:8px}.siteitem{width:100%;background:#fff;color:#111827;border:1px solid #e5e7eb;text-align:left;margin-top:7px;padding:10px}.star{float:right;background:transparent;color:#6b7280;padding:0;font-size:19px}.sectionlabel{font-size:12px;font-weight:850;color:#6b7280;margin-top:12px;text-transform:uppercase;letter-spacing:.04em}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:18px;overflow:auto}.modal>.card{max-width:660px;margin:3vh auto}.report-table{width:100%;border-collapse:collapse;font-size:12px}.report-table th,.report-table td{border-bottom:1px solid #e5e7eb;padding:8px 5px;text-align:left;vertical-align:top}.report-table th{font-size:11px;color:#6b7280}.tagtotal td{font-weight:850;background:#f8fafc}.spesen-note{font-size:12px;color:#166534;margin-top:5px}
#printHost{display:none}.report{font-family:Arial,Helvetica,sans-serif;color:#000;width:190mm;margin:auto;font-size:12pt}.r-head{display:grid;grid-template-columns:42mm 1fr 54mm;border:1.2px solid #000}.r-logo{padding:5mm 4mm;font-size:16pt;font-weight:900;line-height:1.05}.r-logo span{font-size:9pt}.r-title{border-left:1px solid #000;padding:4mm;font-weight:900;font-size:16pt;display:flex;align-items:center}.r-meta{border-left:1px solid #000}.r-meta div{padding:2.2mm 3mm;border-bottom:1px solid #000}.r-info{border:1.2px solid #000;border-top:0;display:grid;grid-template-columns:1fr 1fr}.r-info>div{padding:2.5mm 3mm;border-right:1px solid #000;border-bottom:1px solid #000;min-height:9mm}.r-section{border:1.2px solid #000;border-top:0}.r-section-title{text-align:center;font-weight:900;padding:2mm;border-bottom:1px solid #000}.workrow{display:grid;grid-template-columns:26mm 1fr;min-height:13mm;border-bottom:1px solid #000}.workday{padding:3mm;border-right:1px solid #000;font-weight:700}.worktext{padding:2mm 3mm;white-space:pre-wrap;line-height:1.35}.hours-table{width:100%;border-collapse:collapse;font-size:10.3pt}.hours-table th,.hours-table td{border:1px solid #000;padding:1.7mm 1mm;text-align:center;height:7mm}.consolidated{font-size:10.5pt}.consolidated h1{font-size:18pt;margin:0 0 3mm}.consolidated table{width:100%;border-collapse:collapse}.consolidated th,.consolidated td{border:1px solid #000;padding:2mm;vertical-align:top}.consolidated .sum td{font-weight:bold}.r-note{font-size:8.5pt;margin-top:2mm}@media(max-width:600px){.grid2{grid-template-columns:1fr}.days{gap:4px}.day{padding:9px 2px}.wrap{padding-left:10px;padding-right:10px}.card{border-radius:14px}.actiongrid{grid-template-columns:1fr 1fr}.taskgrid{grid-template-columns:1fr 1fr}}@media print{body>*:not(#printHost){display:none!important}#printHost{display:block}@page{size:A4 portrait;margin:10mm}}
</style></head><body><header><div class="brand">JPRAG Rapport <small>V2 · lokal auf diesem Gerät</small></div><button class="ghost small" onclick="showSettings()">⚙ Einstellungen</button></header><div class="wrap"><div id="setup" class="card hidden"><h2>Ersteinrichtung</h2><p class="muted">Diese Angaben werden nur lokal auf diesem Gerät gespeichert.</p><div class="grid2"><div><label>Monteur</label><input id="setupName"></div><div><label>Pers.-Nr.</label><input id="setupPers"></div></div><button class="full" style="margin-top:12px" onclick="saveSetup()">Speichern & starten</button></div><div id="main" class="hidden"><div class="weeknav"><button class="secondary" onclick="shiftWeek(-1)">‹</button><div class="weektitle" id="weekTitle"></div><button class="secondary" onclick="shiftWeek(1)">›</button></div><div class="days" id="dayTabs"></div><div id="weekendTabs" class="days" style="grid-template-columns:repeat(2,1fr);margin-top:7px"></div><button id="addWeekend" class="ghost small full" style="margin:8px 0 12px" onclick="chooseWeekend()">＋ Arbeitstag hinzufügen</button><div class="card"><div class="row between"><div><h2 id="dayTitle"></h2><div class="muted" id="dayDateLabel"></div></div><button class="secondary small" onclick="openSitePicker()">＋ Baustelle / Spezial</button></div><div id="entries"></div><div id="dayTotal" class="totalbar low"></div></div><div class="card"><div class="actiongrid"><button onclick="showWeeklyReport()">📋 Wochenbericht</button><button class="secondary" onclick="showSiteReports()">🏗 Baustellenberichte</button></div></div></div></div><div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div><div id="printHost"></div><script>
const OFFICIAL=[
['11122021','2 MFH Nänikon'],['11122047','1 MFH Überlandstr. 229, Dübendorf'],['11123036','NB Domum, Tagelswangen'],['11123042','NB Rubia, Russikon'],['11123051','NB 2MFH Rikonerstr. 1, Grafstal'],['11124019','NB Angst Hutzlenstr. 21, Volketswil'],['11124024','NB Untere Landstr., Ehrikon'],['11124026','Neubau Binzholz Wald'],['11124033','NB Grüningerstr. Ottikon'],['11124036','NB Gschwaderstr. Uster'],['11124042','NB Rebweg, Meilen'],['11124045','NB Abelia Ährenweg 11, Oerlikon'],['11125001','NB Kemptnerstr. Hinwil'],['11125002','NB Glatttalstr. Seebach'],['11125005','NB/UB Puurehuus Wermatswil'],['11125009','NB Russikerstr. Fehraltorf'],['11125011','NB Rebenstr. Effretikon'],['11125016','NB MFH Alte Landstr. Meilen'],['11125028','NB Obere Galtbergstr. 7, Gossau'],['11125030','NB Langrütistr. 20a, Dürnten'],['11125042','NB Oberackerstr. Breiti-Nürensdorf'],['11125046','UB Küsnachterstr. 25, Zumikon'],['11125049','NB Rennweg Theilingen'],['11125052','NB Strandbadstr. Wetzikon'],['11125057','NB Hofstetterstr. 62-66, Oberglatt'],['11125058','NB Arnold-Islerstr. Dübendorf'],['11125060','NB Zelgacherstr. 5, Hadlikon'],['11125062','NB Bachgasse 8, Uster'],['11125064','UB Erlengutstrasse 3, Erlenbach'],['11126003','NB Gupfen Illnau'],['11126006','NB Chapfstr. 8, Gossau'],['11126010','NB Tamarix, Tobeleggweg 32, Zürich'],['11126011','NB Angelica, Ackersteinstr. 141, Zürich'],['11126023','NB DEFH Saatwiesenstr. 17, Dübendorf']
].map(x=>({id:'o-'+x[0],nr:x[0],name:x[1],official:true}));
const SPECIAL=[['991','Direktverkauf'],['992','Kompensiert / Frei'],['993','Krankheit'],['994','Militär / Zivilschutz'],['995','Unbezahlt FREI/FERIEN'],['996','Unproduktive Arbeiten JPRAG'],['997','Ferien'],['998','Unfall'],['999','Schule + ÜK']].map(x=>({id:'s-'+x[0],nr:x[0],name:x[1],special:true}));
const TASKS=['Rohre einlegen','Wände einlegen','Dübeln','Spitzen / Gipsen / Verrohren (Rohbau)','Kabel / Drähte einziehen','Netzwerkkabel einziehen','Raumthermostat-Kabel einziehen','Dosen verdrahten','UV verdrahten','Geräte verdrahten','Netzwerk kontrollieren','Dosen stopfen','Lampen / Spots montieren','Fertigmontage'];const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let profile=JSON.parse(localStorage.getItem('jpr_profile')||'null');let locals=JSON.parse(localStorage.getItem('jpr_local_sites')||'[]');let data=JSON.parse(localStorage.getItem('jpr_weeks')||'{}');let favorites=JSON.parse(localStorage.getItem('jpr_favorites')||'[]');let recent=JSON.parse(localStorage.getItem('jpr_recent')||'[]');let weekStart=getMonday(new Date()),selectedDay=0,editingIndex=null,selectedSite=null,editTasks=[];
function getMonday(d){d=new Date(d);d.setHours(12,0,0,0);const n=d.getDay()||7;d.setDate(d.getDate()-n+1);return d}function iso(d){return d.toISOString().slice(0,10)}function wkKey(){return iso(weekStart)}function ensureWeek(){if(!data[wkKey()])data[wkKey()]={days:{},weekends:[],spesenOverride:{}};for(let i=0;i<7;i++)if(!data[wkKey()].days[i])data[wkKey()].days[i]=[]}function save(){localStorage.setItem('jpr_weeks',JSON.stringify(data));render()}function fmtDate(d){return new Intl.DateTimeFormat('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}function kw(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function dayDate(i){let d=new Date(weekStart);d.setDate(d.getDate()+i);return d}function num(n){return(+n||0).toLocaleString('de-CH',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function taskText(t){return[t.base,t.detail].filter(Boolean).join(', ')}function allSites(){return[...OFFICIAL,...locals.map(x=>({...x,local:true})),...SPECIAL]}function totalDay(i,workOnly=false){return data[wkKey()].days[i].reduce((s,e)=>s+(workOnly&&e.special?0:+e.hours||0),0)}function init(){if(!profile){setup.classList.remove('hidden')}else{main.classList.remove('hidden');ensureWeek();render()}}function saveSetup(){profile={name:setupName.value.trim(),pers:setupPers.value.trim()};if(!profile.name)return alert('Bitte Monteur eingeben.');localStorage.setItem('jpr_profile',JSON.stringify(profile));setup.classList.add('hidden');main.classList.remove('hidden');ensureWeek();render()}function shiftWeek(n){weekStart.setDate(weekStart.getDate()+7*n);selectedDay=0;ensureWeek();render()}
function render(){ensureWeek();weekTitle.textContent=`KW ${kw(weekStart)} · ${fmtDate(dayDate(0))}–${fmtDate(dayDate(6))}`;dayTabs.innerHTML='';for(let i=0;i<5;i++)dayTabs.appendChild(dayButton(i,false));weekendTabs.innerHTML='';for(const i of data[wkKey()].weekends)weekendTabs.appendChild(dayButton(i,true));addWeekend.style.display=data[wkKey()].weekends.length===2?'none':'block';renderDay()}function dayButton(i,optional){const b=document.createElement('div');b.className='day'+(selectedDay===i?' active':'');let t=totalDay(i),cl=i<5?(t>=8?'ok':'low'):'ok';b.innerHTML=`<div class="dn">${DAYS[i].slice(0,2)}</div><div>${dayDate(i).getDate()}</div><div class="hours ${cl}">${t?num(t)+' h':'—'}</div>${optional?`<button class="weekend-remove" onclick="event.stopPropagation();removeWeekend(${i})">×</button>`:''}`;b.onclick=()=>{selectedDay=i;render()};return b}function chooseWeekend(){const opts=[5,6].filter(i=>!data[wkKey()].weekends.includes(i));modalCard.innerHTML=modalHead('Arbeitstag hinzufügen')+opts.map(i=>`<button class="full secondary" style="margin-top:8px" onclick="addWeekendDay(${i})">${DAYS[i]} · ${fmtDate(dayDate(i))}</button>`).join('');modal.classList.remove('hidden')}function addWeekendDay(i){data[wkKey()].weekends.push(i);selectedDay=i;closeModal();save()}function removeWeekend(i){const has=data[wkKey()].days[i].length;if(has&&!confirm(`${DAYS[i]} und alle Einträge löschen?`))return;if(has)data[wkKey()].days[i]=[];data[wkKey()].weekends=data[wkKey()].weekends.filter(x=>x!==i);if(selectedDay===i)selectedDay=0;save()}
function renderDay(){dayTitle.textContent=DAYS[selectedDay];dayDateLabel.textContent=fmtDate(dayDate(selectedDay));const es=data[wkKey()].days[selectedDay];entries.innerHTML=es.length?'':'<p class="muted">Noch keine Einträge für diesen Tag.</p>';es.forEach((e,i)=>entries.appendChild(entryNode(e,i)));let t=totalDay(selectedDay),cl=selectedDay<5?(t>=8?'ok':'low'):'ok';dayTotal.className='totalbar '+cl;dayTotal.innerHTML=`<span>Total</span><span>${num(t)} h</span>`}function entryNode(e,i){const d=document.createElement('div');d.className='entry';let tasks=e.special?`<div class="taskline">${esc(e.name)}</div>`:(e.tasks||[]).map(t=>`<div class="taskline">• ${esc(taskText(t))}</div>`).join('');d.innerHTML=`<div class="entry-head"><div><div class="entry-name">${esc(e.name)} ${e.local?'<span class="pill local">Lokal</span>':''}</div>${tasks}</div><div><div class="entry-hours">${num(e.hours)} h</div><button class="ghost small" style="margin-top:6px" onclick="editEntry(${i})">Bearbeiten</button></div></div>`;return d}
function modalHead(t){return`<div class="row between"><h3>${t}</h3><button class="ghost small" onclick="closeModal()">✕</button></div>`}function openSitePicker(){editingIndex=null;selectedSite=null;renderSitePicker()}function renderSitePicker(q=''){let query=q.trim().toLowerCase(),sites=allSites(),body='';if(query){let found=sites.filter(s=>(s.nr+' '+s.name).toLowerCase().includes(query));body=found.map(siteButton).join('')||'<p class="muted">Keine Treffer.</p>'}else{let fav=favorites.map(id=>sites.find(s=>s.id===id)).filter(Boolean),rec=recent.map(id=>sites.find(s=>s.id===id)).filter(s=>s&&!favorites.includes(s.id));if(fav.length)body+=`<div class="sectionlabel">★ Favoriten</div>`+fav.map(siteButton).join('');if(rec.length)body+=`<div class="sectionlabel">Zuletzt verwendet</div>`+rec.map(siteButton).join('');body+=`<div class="sectionlabel">Alle Baustellen / Spezialcodes</div>`+sites.map(siteButton).join('')}modalCard.innerHTML=modalHead('Baustelle / Spezial wählen')+`<div class="site-search"><input id="siteSearch" placeholder="Baustelle suchen · Name oder Auftrag-Nr." value="${esc(q)}" oninput="renderSitePicker(this.value);setTimeout(()=>{siteSearch.focus();siteSearch.setSelectionRange(siteSearch.value.length,siteSearch.value.length)},0)"></div><div id="siteResults">${body}</div><button class="ghost full" style="margin-top:10px" onclick="newLocalSite()">＋ Neue Baustelle hinzufügen</button>`;modal.classList.remove('hidden')}function siteButton(s){return`<button class="siteitem" onclick="selectSite('${s.id}')"><strong>${esc(s.name)}</strong>${s.local?'<span class="pill local">Lokal</span>':''}<div class="muted">${esc(s.nr)}</div></button>`}function selectSite(id){selectedSite=allSites().find(s=>s.id===id);if(!selectedSite)return;recent=[id,...recent.filter(x=>x!==id)].slice(0,5);localStorage.setItem('jpr_recent',JSON.stringify(recent));openEntryForm()}function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('jpr_favorites',JSON.stringify(favorites));openEntryForm()}
function editEntry(i){editingIndex=i;let e=data[wkKey()].days[selectedDay][i];selectedSite={id:e.siteId,nr:e.nr,name:e.name,special:e.special,local:e.local};editTasks=JSON.parse(JSON.stringify(e.tasks||[]));openEntryForm(e)}function openEntryForm(existing=null){if(!selectedSite)return;let e=existing||(editingIndex!==null?data[wkKey()].days[selectedDay][editingIndex]:null),rate=e?.rate||100,hours=e?.hours||'',isFav=favorites.includes(selectedSite.id);if(!e)editTasks=[];modalCard.innerHTML=modalHead(e?'Eintrag bearbeiten':'Eintrag hinzufügen')+`<div class="row between"><div><strong>${esc(selectedSite.name)}</strong><div class="muted">${esc(selectedSite.nr)}</div></div><button class="ghost small" onclick="toggleFavorite('${selectedSite.id}')">${isFav?'★ Favorit':'☆ Favorit'}</button></div><div class="grid2"><div><label>Stunden</label><input id="eHours" type="number" min="0" step="0.25" value="${hours}"></div><div><label>&nbsp;</label><select id="eRate"><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></div></div>${selectedSite.special?'':`<label style="margin-top:14px">Ausgeführte Arbeiten</label><div class="taskgrid" id="taskButtons"></div><button class="ghost small full" id="moreTasks" style="margin-top:8px" onclick="window.showAllTasks=true;renderTaskButtons()">Mehr Arbeiten anzeigen ↓</button><button class="ghost small full" style="margin-top:8px" onclick="addFreeTask()">＋ Andere Arbeit</button><div id="taskDetails"></div>`}<details style="margin-top:12px"><summary><strong>Weitere Angaben</strong></summary><div class="grid2"><div><label>Auto km</label><input id="eAuto" type="number" value="${e?.auto||''}"></div><div><label>Töff km</label><input id="eToeff" type="number" value="${e?.toeff||''}"></div></div><label>Andere Spesen CHF</label><input id="eOther" type="number" step="0.5" value="${e?.other||''}"></details><button class="full" style="margin-top:14px" onclick="saveEntry()">Speichern</button>${e?'<button class="danger full" style="margin-top:8px" onclick="removeEntry()">Eintrag löschen</button>':''}`;modal.classList.remove('hidden');eRate.value=rate;window.showAllTasks=false;if(!selectedSite.special){renderTaskButtons();renderTaskDetails()}}
function renderTaskButtons(){let max=window.showAllTasks?TASKS.length:10;taskButtons.innerHTML=TASKS.slice(0,max).map((t,i)=>`<button class="taskbtn ${editTasks.some(x=>x.base===t)?'selected':''}" onclick="toggleTask(${i})">${editTasks.some(x=>x.base===t)?'✓ ':''}${esc(t)}</button>`).join('');if(window.showAllTasks)moreTasks.classList.add('hidden')}function toggleTask(i){let t=TASKS[i],p=editTasks.findIndex(x=>x.base===t);if(p>=0)editTasks.splice(p,1);else editTasks.push({base:t,detail:''});renderTaskButtons();renderTaskDetails()}function addFreeTask(){editTasks.push({base:'Andere Arbeit',detail:''});renderTaskDetails()}function renderTaskDetails(){taskDetails.innerHTML=editTasks.map((t,i)=>`<div class="taskdetail"><strong>${esc(t.base)}</strong><label>Wo / Details (optional)</label><input value="${esc(t.detail||'')}" oninput="editTasks[${i}].detail=this.value"><button class="ghost small" style="margin-top:6px" onclick="editTasks.splice(${i},1);renderTaskButtons();renderTaskDetails()">Entfernen</button></div>`).join('')}function saveEntry(){let hours=+eHours.value;if(!hours)return alert('Bitte Stunden eingeben.');let old=editingIndex!==null?data[wkKey()].days[selectedDay][editingIndex]:null;let e={uid:old?.uid||'e'+Date.now(),siteId:selectedSite.id,nr:selectedSite.nr,name:selectedSite.name,official:!!selectedSite.official,local:!!selectedSite.local,special:!!selectedSite.special,hours,rate:+eRate.value,tasks:selectedSite.special?[]:editTasks,auto:+eAuto.value||0,toeff:+eToeff.value||0,other:+eOther.value||0};if(editingIndex===null)data[wkKey()].days[selectedDay].push(e);else data[wkKey()].days[selectedDay][editingIndex]=e;closeModal();save()}function removeEntry(){if(confirm('Eintrag löschen?')){data[wkKey()].days[selectedDay].splice(editingIndex,1);closeModal();save()}}
function newLocalSite(){modalCard.innerHTML=modalHead('Neue Baustelle')+'<label>Auftrags-Nr.</label><input id="newNr"><label>Baustelle</label><input id="newName"><p class="muted">Wird lokal auf diesem Gerät gespeichert.</p><button class="full" onclick="saveLocalSite()">Speichern & verwenden</button>'}function saveLocalSite(){let nr=newNr.value.trim(),name=newName.value.trim();if(!nr||!name)return alert('Nummer und Baustelle eingeben.');let s={id:'l-'+Date.now(),nr,name,local:true};locals.push(s);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));selectedSite=s;openEntryForm()}
function getSpesenTarget(d){let es=data[wkKey()].days[d].filter(e=>!e.special),work=es.reduce((s,e)=>s+(+e.hours||0),0);if(work<6||!es.length)return null;let override=data[wkKey()].spesenOverride?.[d];if(override){let m=es.find(e=>e.uid===override);if(m)return m}return[...es].sort((a,b)=>(+b.hours-+a.hours)||a.name.localeCompare(b.name,'de'))[0]}function getSpesenForEntry(d,e){let t=getSpesenTarget(d);return t&&t.uid===e.uid?12:0}
function showWeeklyReport(){let rows='',weekTotal=0;for(let d=0;d<7;d++){let es=data[wkKey()].days[d];if(!es.length)continue;let dt=totalDay(d);weekTotal+=dt;es.forEach((e,j)=>{let acts=e.special?e.name:(e.tasks||[]).map(taskText).join(' · ');rows+=`<tr><td>${j?'':DAYS[d]}</td><td>${esc(e.nr)}</td><td>${esc(e.name)}</td><td>${esc(acts)}</td><td>${num(e.hours)}</td><td>${getSpesenForEntry(d,e)?'12':''}</td></tr>`});rows+=`<tr class="tagtotal"><td colspan="4">Tagessumme ${DAYS[d]}</td><td>${num(dt)}</td><td></td></tr>`}modalCard.innerHTML=modalHead('Wochenbericht')+`<div style="overflow:auto"><table class="report-table"><thead><tr><th>Tag</th><th>Auftrag-Nr.</th><th>Baustelle</th><th>Ausgeführte Arbeiten</th><th>Stunden</th><th>Spesen</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Keine Einträge.</td></tr>'}</tbody></table></div><div class="totalbar" style="margin-top:10px;background:#f3f4f6"><span>Wochenstunden</span><span>${num(weekTotal)} h</span></div><button class="full" style="margin-top:10px" onclick="printWeeklyReport()">PDF / Drucken</button>`;modal.classList.remove('hidden')}function printWeeklyReport(){let rows='',weekTotal=0;for(let d=0;d<7;d++){let es=data[wkKey()].days[d];if(!es.length)continue;let dt=totalDay(d);weekTotal+=dt;es.forEach((e,j)=>{let acts=e.special?e.name:(e.tasks||[]).map(taskText).join(' · ');rows+=`<tr><td>${j?'':DAYS[d]}</td><td>${esc(e.nr)}</td><td>${esc(e.name)}</td><td>${esc(acts)}</td><td>${num(e.hours)}</td><td>${getSpesenForEntry(d,e)?'12':''}</td></tr>`});rows+=`<tr class="sum"><td colspan="4">Tagessumme ${DAYS[d]}</td><td>${num(dt)}</td><td></td></tr>`}let m=dayDate(0).getMonth(),y=dayDate(0).getFullYear();printHost.innerHTML=`<div class="report consolidated"><h1>Wochenbericht</h1><p><strong>${esc(profile.name)}</strong> · Pers.-Nr. ${esc(profile.pers||'')} · KW ${kw(weekStart)} · Monat ${m+1} – ${MONTHS[m]} ${y}</p><table><thead><tr><th>Tag</th><th>Auftrag-Nr.</th><th>Baustelle</th><th>Ausgeführte Arbeiten</th><th>Stunden</th><th>Spesen</th></tr></thead><tbody>${rows}</tbody></table><p><strong>Wochenstunden: ${num(weekTotal)} h</strong></p></div>`;setTimeout(()=>window.print(),80)}
function showSiteReports(){let map={};for(let d=0;d<7;d++)for(const e of data[wkKey()].days[d]){if(!map[e.siteId])map[e.siteId]={...e,total:0};map[e.siteId].total+=+e.hours||0}let vals=Object.values(map);modalCard.innerHTML=modalHead('Baustellenberichte')+(vals.length?vals.map(r=>`<div class="entry row between"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.nr)} · ${num(r.total)} h</div></div><button class="small" onclick="printReport('${r.siteId}')">Rapport erstellen</button></div>`).join(''):'<p class="muted">Noch keine Rapporte in dieser Woche.</p>');modal.classList.remove('hidden')}function printReport(siteId){let site=null,byDay={};for(let d=0;d<7;d++){let es=data[wkKey()].days[d].filter(e=>e.siteId===siteId);if(es.length){site=es[0];byDay[d]=es}}if(!site)return;let m=dayDate(0).getMonth(),y=dayDate(0).getFullYear(),workRows='';for(let d=0;d<7;d++){if(d>4&&!byDay[d])continue;let texts=(byDay[d]||[]).flatMap(e=>e.special?[e.name]:(e.tasks||[]).map(taskText));workRows+=`<div class="workrow"><div class="workday">${DAYS[d]}</div><div class="worktext">${texts.map(esc).join('\n')}</div></div>`}let rows='';for(let d=0;d<7;d++)for(const e of(byDay[d]||[]))rows+=`<tr><td>${fmtDate(dayDate(d)).slice(0,5)}</td><td>${e.rate===100?num(e.hours):''}</td><td>${e.rate===125?num(e.hours):''}</td><td>${e.rate===150?num(e.hours):''}</td><td>${e.rate===200?num(e.hours):''}</td><td></td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${getSpesenForEntry(d,e)||e.other||''}</td></tr>`;printHost.innerHTML=`<div class="report"><div class="r-head"><div class="r-logo">J. PETER REICH AG<br><span>Elektroanlagen · Telekommunikation</span></div><div class="r-title">Rapport / Regiearbeiten</div><div class="r-meta"><div>Monat: <strong>${m+1} – ${MONTHS[m]}</strong></div><div>Jahr: <strong>${y}</strong></div><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Auftrags-Nr.: <strong>${esc(site.nr)}</strong></div><div>Baustelle: <strong>${esc(site.name)}</strong></div><div>Architekt / Bauherr:</div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div>${workRows}</div><div class="r-section"><div class="r-section-title">Stundenkontrolle</div><table class="hours-table"><thead><tr><th>Datum</th><th>100%</th><th>125%</th><th>150%</th><th>200%</th><th>Zulagen</th><th>Auto km</th><th>Töff km</th><th>Spesen</th></tr></thead><tbody>${rows}</tbody></table></div><div class="r-note">Digital erstellt · KW ${kw(weekStart)}</div></div>`;setTimeout(()=>window.print(),80)}
function showSettings(){modalCard.innerHTML=modalHead('Einstellungen')+`<div class="grid2"><div><label>Monteur</label><input id="sName" value="${esc(profile.name)}"></div><div><label>Pers.-Nr.</label><input id="sPers" value="${esc(profile.pers||'')}"></div></div><p class="muted">Tageskontrolle: fest 8 h · Spesen: CHF 12 ab 6 Arbeitsstunden.</p><button class="full" onclick="saveSettings()">Speichern</button><hr style="border:0;border-top:1px solid #e5e7eb;margin:18px 0"><h3>Lokale Baustellen</h3>${locals.length?locals.map((s,i)=>`<div class="entry row between"><div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.nr)}</div></div><button class="danger small" onclick="deleteLocal(${i})">Löschen</button></div>`).join(''):'<p class="muted">Keine lokalen Baustellen.</p>'}<button class="ghost full" onclick="newLocalSite()">＋ Neue Baustelle</button>`;modal.classList.remove('hidden')}function saveSettings(){profile={name:sName.value.trim(),pers:sPers.value.trim()};localStorage.setItem('jpr_profile',JSON.stringify(profile));closeModal();render()}function deleteLocal(i){if(confirm('Lokale Baustelle löschen? Bereits erfasste Rapporte bleiben erhalten.')){locals.splice(i,1);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));showSettings()}}function closeModal(){modal.classList.add('hidden')}init();
</script></body></html>
