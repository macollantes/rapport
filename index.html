function weeklyMobileBlocks(){let out='',weekTotal=0;for(let d=0;d<7;d++){let es=data[wkKey()].days[d];if(!es.length)continue;let dt=totalDay(d);weekTotal+=dt;out+=`<section class="week-day-block"><div class="week-day-head"><div><strong>${DAYS[d]}</strong><span>${fmtDate(dayDate(d))}</span></div><div class="week-day-total">${num(dt)} Std.</div></div>`;for(const e of es){let sp=getSpesenForEntry(d,e),tasks=e.special?`<div class="mobile-task">${esc(e.name)}</div>`:(e.tasks||[]).map(t=>`<div class="mobile-task"><strong>${esc(t.base)}</strong>${t.detail?`<span>${esc(t.detail)}</span>`:''}</div>`).join('');let extras=[];if(sp)extras.push(`Spesen ${num(sp)} CHF`);if(e.auto)extras.push(`Auto ${num(e.auto)} km`);if(e.toeff)extras.push(`Töff ${num(e.toeff)} km`);if(e.other)extras.push(`Div. Spesen ${num(e.other)} CHF`);out+=`<div class="mobile-report-row"><div class="mobile-report-top"><div><div class="mobile-site">${esc(e.name)}</div><div class="mobile-order">${esc(e.nr)}</div></div><div class="mobile-hours">${num(e.hours)}</div></div>${tasks}${extras.length?`<div class="mobile-extras">${extras.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>`}out+='</section>'}return{html:out,weekTotal}}function showWeeklyReport(){let r=weeklyMobileBlocks(),m=dayDate(0).getMonth(),y=dayDate(0).getFullYear();modal.classList.remove('entry-mode');modal.classList.add('report-mode');modalCard.innerHTML=`<div class="report-screen"><div class="report-screen-nav"><button class="ghost small" onclick="closeModal()">← Zurück</button></div><div class="mobile-report-header"><div class="mobile-report-title">Wochenbericht</div><div>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</div><div class="muted">${esc(profile.name)}${profile.pers?` · Pers.-Nr. ${esc(profile.pers)}`:''} · KW ${kw(weekStart)}</div></div>${r.html||'<div class="card"><p class="muted">Keine Einträge.</p></div>'}<div class="mobile-week-total"><span>Wochenstunden</span><strong>${num(r.weekTotal)} Std.</strong></div><div class="report-send"><button class="full" onclick="printWeeklyReport()">Wochenbericht senden</button></div></div>`;modal.classList.remove('hidden')}function printWeeklyReport(){let r=weeklyRows(true),m=dayDate(0).getMonth(),y=dayDate(0).getFullYear();printHost.innerHTML=`<div class="report consolidated"><div class="r-head"><div class="r-logo pdf-logo"><img src="logo-neu.png" alt="J. Peter Reich AG"></div><div class="r-title">Wochenbericht</div><div class="r-meta"><div>Monat: <strong>${m+1} – ${MONTHS[m]}</strong></div><div>Jahr: <strong>${y}</strong></div><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Woche: <strong>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</strong></div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div><table class="hours-table consolidated-table"><thead><tr><th>Tag</th><th>Auftrag-Nr.</th><th>Baustelle</th><th>Ausgeführte Arbeiten</th><th>Std.</th><th>Spesen</th><th>Auto km</th><th>Töff km</th><th>Div. Spesen</th></tr></thead><tbody>${r.rows}</tbody></table></div><div class="r-note" style="display:flex;justify-content:space-between"><span>Digital erstellt · KW ${kw(weekStart)}</span><strong>Wochenstunden: ${num(r.weekTotal)} Std.</strong></div></div>`;setTimeout(()=>window.print(),80)}function showSiteReports(){let map={};for(let d=0;d<7;d++)for(const e of data[wkKey()].days[d]){if(!map[e.siteId])map[e.siteId]={...e,total:0};map[e.siteId].total+=+e.hours||0}let vals=Object.values(map);modalCard.innerHTML=modalHead('Baustellenberichte')+(vals.length?vals.map(r=>`<div class="entry row between"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.nr)} · ${num(r.total)}</div></div><button class="small" onclick="printReport('${r.siteId}')">Rapport erstellen</button></div>`).join(''):'<p class="muted">Noch keine Rapporte in dieser Woche.</p>');modal.classList.remove('hidden')}function printReport(siteId){let site=null,byDay={};for(let d=0;d<7;d++){let es=data[wkKey()].days[d].filter(e=>e.siteId===siteId);if(es.length){site=es[0];byDay[d]=es}}if(!site)return;let m=dayDate(0).getMonth(),y=dayDate(0).getFullYear(),workRows='';for(let d=0;d<7;d++){if(d>4&&!byDay[d])continue;let texts=(byDay[d]||[]).flatMap(e=>e.special?[e.name]:(e.tasks||[]).map(taskText));workRows+=`<div class="workrow"><div class="workday">${DAYS[d]}</div><div class="worktext">${texts.map(esc).join('\n')}</div></div>`}let rows='';for(let d=0;d<7;d++)for(const e of(byDay[d]||[]))rows+=`<tr><td>${fmtDate(dayDate(d)).slice(0,5)}</td><td>${e.rate===100?num(e.hours):''}</td><td>${e.rate===125?num(e.hours):''}</td><td>${e.rate===150?num(e.hours):''}</td><td>${e.rate===200?num(e.hours):''}</td><td></td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${(getSpesenForEntry(d,e)||0)+(e.other||0)||''}</td></tr>`;printHost.innerHTML=`<div class="report"><div class="r-head"><div class="r-logo pdf-logo"><img src="logo-neu.png" alt="J. Peter Reich AG"></div><div class="r-title">Rapport / Regiearbeiten</div><div class="r-meta"><div>Monat: <strong>${m+1} – ${MONTHS[m]}</strong></div><div>Jahr: <strong>${y}</strong></div><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Auftrags-Nr.: <strong>${esc(site.nr)}</strong></div><div>Baustelle: <strong>${esc(site.name)}</strong></div><div>Architekt / Bauherr:</div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div>${workRows}</div><div class="r-section"><div class="r-section-title">Stundenkontrolle</div><table class="hours-table"><thead><tr><th>Datum</th><th>100%</th><th>125%</th><th>150%</th><th>200%</th><th>Zulagen</th><th>Auto km</th><th>Töff km</th><th>Spesen</th></tr></thead><tbody>${rows}</tbody></table></div><div class="r-note">Digital erstellt · KW ${kw(weekStart)}</div></div>`;setTimeout(()=>window.print(),80)}
function showSettings(){modal.classList.remove('report-mode');modal.classList.remove('entry-mode');modalCard.innerHTML=modalHead('Einstellungen')+`<div class="grid2"><div><label>Monteur</label><input id="sName" value="${esc(profile.name)}"></div><div><label>Pers.-Nr.</label><input id="sPers" value="${esc(profile.pers||'')}"></div></div><div style="margin-top:12px"><label>Spesen pro Tag (CHF)</label><input id="sSpesen" type="number" min="0" step="0.5" value="${spesenValue()}"><p class="muted" style="font-size:12px">Wird automatisch ab 6 Arbeitsstunden der Baustelle mit den meisten Stunden zugeordnet.</p></div><p class="muted">Tageskontrolle: fest 8 Std.</p><button class="full" onclick="saveSettings()">Speichern</button>`;modal.classList.remove('hidden')}function saveSettings(){profile={...profile,name:sName.value.trim(),pers:sPers.value.trim(),spesen:Math.max(0,Number(sSpesen.value)||0)};localStorage.setItem('jpr_profile',JSON.stringify(profile));closeModal();render()}function deleteLocal(i){if(confirm('Lokale Baustelle löschen? Bereits erfasste Rapporte bleiben erhalten.')){locals.splice(i,1);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));showSettings()}}function closeModal(){modal.classList.add('hidden');modal.classList.remove('entry-mode');modal.classList.remove('report-mode');entryDraft=null;workPickerIndex=null}init();
</script></body></html>
