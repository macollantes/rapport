<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<title>JPRAG Rapport V1</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#111827;--danger:#c62828;--ok:#0f7a3d;--soft:#eef2f7;--warn:#a16207}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600}.wrap{max-width:820px;margin:auto;padding:14px 14px 100px}.card{background:var(--card);border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.035)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)} h2,h3{margin:0 0 10px}button,.btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:750;background:#111827;color:#fff;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.ghost{background:#fff;color:#111827;border:1px solid var(--line)}.danger{background:#fee2e2;color:#991b1b}.small{padding:8px 10px;font-size:13px}.full{width:100%}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cfd4dc;border-radius:10px;font:inherit;background:#fff}textarea{min-height:76px;resize:vertical}label{font-size:12px;font-weight:750;color:#4b5563;display:block;margin:8px 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.weeknav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-bottom:12px}.weektitle{text-align:center;font-weight:850}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer}.day.active{outline:2px solid #111827}.day .dn{font-size:12px;color:var(--muted)}.day .hours{font-weight:850;margin-top:4px}.hours.low{color:var(--danger)}.hours.exact{color:#111;font-weight:900}.hours.over{color:var(--ok)}
.entry{border-top:1px solid #e5e7eb;padding:12px 0}.entry:first-of-type{border-top:0}.pill{display:inline-flex;align-items:center;gap:5px;background:#eef2f7;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}.pill.local{background:#fff7ed;color:#9a3412}.taskline{font-size:14px;margin:4px 0}.totalbar{border-radius:12px;padding:12px 14px;font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.totalbar.low{background:#fee2e2;color:#991b1b}.totalbar.exact{background:#f3f4f6;color:#111}.totalbar.over{background:#dcfce7;color:#166534}
.taskbuttons{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.taskbuttons button{white-space:nowrap;background:#eef2f7;color:#111827;border:1px solid #d8dee7;font-size:13px;padding:9px 11px}.taskitem{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.taskitem .row{flex-wrap:nowrap}.taskitem input{flex:1}.taskitem button{flex:0 0 auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#e5e7eb;color:#111}.tabs button.active{background:#111827;color:#fff}.hidden{display:none!important}.notice{background:#fffbeb;border:1px solid #fde68a;color:#854d0e;border-radius:12px;padding:10px;font-size:13px;margin:8px 0}.spesen{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:12px;padding:10px;margin-top:10px;font-size:13px}.footer-actions{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px;z-index:6}.footer-actions>div{max-width:820px;margin:auto;display:flex;gap:8px}.footer-actions button{flex:1}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}.days{gap:4px}.day{padding:9px 2px}.wrap{padding-left:10px;padding-right:10px}.card{border-radius:14px}.brand{font-size:15px}}
/* printable report */
#printHost{display:none}.report{font-family:Arial,Helvetica,sans-serif;color:#000;width:190mm;margin:auto;font-size:10pt}.r-head{display:grid;grid-template-columns:42mm 1fr 54mm;border:1.2px solid #000}.r-logo{padding:5mm 4mm;font-size:16pt;font-weight:900;line-height:1.05}.r-logo span{font-size:8pt;font-weight:700}.r-title{border-left:1px solid #000;padding:4mm;font-weight:900;font-size:15pt;display:flex;align-items:center}.r-meta{border-left:1px solid #000}.r-meta div{padding:2.2mm 3mm;border-bottom:1px solid #000}.r-meta div:last-child{border-bottom:0}.r-info{border:1.2px solid #000;border-top:0;display:grid;grid-template-columns:1fr 1fr}.r-info>div{padding:2.5mm 3mm;border-right:1px solid #000;border-bottom:1px solid #000;min-height:9mm}.r-info>div:nth-child(2n){border-right:0}.r-section{border:1.2px solid #000;border-top:0}.r-section-title{text-align:center;font-weight:900;padding:2mm;border-bottom:1px solid #000}.workrow{display:grid;grid-template-columns:26mm 1fr;min-height:13mm;border-bottom:1px solid #000}.workrow:last-child{border-bottom:0}.workday{padding:3mm;border-right:1px solid #000;font-weight:700}.worktext{padding:2mm 3mm;white-space:pre-wrap;line-height:1.35}.hours-table{width:100%;border-collapse:collapse;font-size:8.3pt}.hours-table th,.hours-table td{border:1px solid #000;padding:1.7mm 1mm;text-align:center;height:7mm}.hours-table th{font-weight:700}.r-note{font-size:7.5pt;margin-top:2mm}
@media print{body>*:not(#printHost){display:none!important}#printHost{display:block}.report{width:190mm}.no-print{display:none!important}@page{size:A4 portrait;margin:10mm}}
</style>
</head>
<body>
<header><div class="brand">JPRAG Rapport <small>V1 · lokal auf diesem Gerät</small></div><button class="ghost small" onclick="showSettings()">⚙ Einstellungen</button></header>
<div class="wrap">
  <div id="setup" class="card hidden">
    <h2>Ersteinrichtung</h2><p class="muted">Diese Angaben werden nur lokal auf diesem Gerät gespeichert.</p>
    <div class="grid2"><div><label>Monteur</label><input id="setupName"></div><div><label>Pers.-Nr.</label><input id="setupPers"></div></div>
    <div class="grid2"><div><label>Normale Tagesstunden</label><input id="setupDaily" type="number" step="0.25" value="8.5"></div><div><label>Spesen ab Arbeitsstunden</label><input id="setupThreshold" type="number" step="0.25" value="6"></div></div>
    <label>Spesen CHF</label><input id="setupSpesen" type="number" step="0.5" value="12">
    <button class="full" style="margin-top:12px" onclick="saveSetup()">Speichern & starten</button>
  </div>

  <div id="main" class="hidden">
    <div class="weeknav"><button class="secondary" onclick="shiftWeek(-1)">‹</button><div class="weektitle" id="weekTitle"></div><button class="secondary" onclick="shiftWeek(1)">›</button></div>
    <div class="days" id="dayTabs"></div>
    <div id="weekendTabs" class="days" style="grid-template-columns:repeat(2,1fr);margin-top:7px"></div>
    <button id="addWeekend" class="ghost small full" style="margin:8px 0 12px" onclick="chooseWeekend()">＋ Samstag / Sonntag hinzufügen</button>

    <div class="card">
      <div class="row between"><div><h2 id="dayTitle">Tag</h2><div class="muted" id="dayDate"></div></div><button class="secondary small" onclick="addEntry()">＋ Baustelle / Spezial</button></div>
      <div id="entries"></div>
      <div id="dayTotal" class="totalbar low"><span>Total</span><span>0 h</span></div>
      <div id="spesenInfo"></div>
    </div>

    <div class="card">
      <div class="row between"><div><h3>Rapporte dieser Woche</h3><div class="muted">Ein PDF/Print-Rapport pro Baustelle oder Spezialcode.</div></div></div>
      <div id="reports"></div>
    </div>
  </div>
</div>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;padding:18px;overflow:auto"><div class="card" style="max-width:620px;margin:3vh auto" id="modalCard"></div></div>
<div id="printHost"></div>
<script>
const OFFICIAL=[
['11122021','2 MFH Nänikon'],['11122047','1 MFH Überlandstr. 229, Dübendorf'],['11123036','NB Domum, Tagelswangen'],['11123042','NB Rubia, Russikon'],['11123051','NB 2MFH Rikonerstr. 1, Grafstal'],['11124019','NB Angst Hutzlenstr. 21, Volketswil'],['11124024','NB Untere Landstr., Ehrikon'],['11124026','Neubau Binzholz Wald'],['11124033','NB Grüningerstr. Ottikon'],['11124036','NB Gschwaderstr. Uster'],['11124042','NB Rebweg, Meilen'],['11124045','NB Abelia Ährenweg 11, Oerlikon'],['11125001','NB Kemptnerstr. Hinwil'],['11125002','NB Glatttalstr. Seebach'],['11125005','NB/UB Puurehuus Wermatswil'],['11125009','NB Russikerstr. Fehraltorf'],['11125011','NB Rebenstr. Effretikon'],['11125016','NB MFH Alte Landstr. Meilen'],['11125028','NB Obere Galtbergstr. 7, Gossau'],['11125030','NB Langrütistr. 20a, Dürnten'],['11125042','NB Oberackerstr. Breiti-Nürensdorf'],['11125046','UB Küsnachterstr. 25, Zumikon'],['11125049','NB Rennweg Theilingen'],['11125052','NB Strandbadstr. Wetzikon'],['11125057','NB Hofstetterstr. 62-66, Oberglatt'],['11125058','NB Arnold-Islerstr. Dübendorf'],['11125060','NB Zelgacherstr. 5, Hadlikon'],['11125062','NB Bachgasse 8, Uster'],['11125064','UB Erlengutstrasse 3, Erlenbach'],['11126003','NB Gupfen Illnau'],['11126006','NB Chapfstr. 8, Gossau'],['11126010','NB Tamarix, Tobeleggweg 32, Zürich'],['11126011','NB Angelica, Ackersteinstr. 141, Zürich'],['11126023','NB DEFH Saatwiesenstr. 17, Dübendorf']
].map(x=>({id:'o-'+x[0],nr:x[0],name:x[1],official:true}));
const SPECIAL=[['991','Direktverkauf'],['992','Kompensiert / Frei'],['993','Krankheit'],['994','Militär / Zivilschutz'],['995','Unbezahlt FREI/FERIEN'],['996','Unproduktive Arbeiten JPRAG'],['997','Ferien'],['998','Unfall'],['999','Schule + ÜK']].map(x=>({id:'s-'+x[0],nr:x[0],name:x[1],special:true}));
const TASKS=['Rohre einlegen','Wände einlegen','Dübeln','Spitzen / Gipsen / Verrohren (Rohbau)','Kabel / Drähte einziehen','Netzwerkkabel einziehen','Raumthermostat-Kabel einziehen','Dosen verdrahten','UV verdrahten','Geräte verdrahten','Netzwerk kontrollieren','Dosen stopfen','Lampen / Spots montieren','Fertigmontage'];
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
let profile=JSON.parse(localStorage.getItem('jpr_profile')||'null');
let locals=JSON.parse(localStorage.getItem('jpr_local_sites')||'[]');
let data=JSON.parse(localStorage.getItem('jpr_weeks')||'{}');
let weekStart=getMonday(new Date()); let selectedDay=0;
function getMonday(d){d=new Date(d); d.setHours(12,0,0,0); const n=d.getDay()||7; d.setDate(d.getDate()-n+1); return d}
function iso(d){return d.toISOString().slice(0,10)} function wkKey(){return iso(weekStart)}
function ensureWeek(){if(!data[wkKey()]) data[wkKey()]={days:{},weekends:[]}; for(let i=0;i<7;i++) if(!data[wkKey()].days[i]) data[wkKey()].days[i]=[]}
function save(){localStorage.setItem('jpr_weeks',JSON.stringify(data)); render()}
function fmtDate(d){return new Intl.DateTimeFormat('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function kw(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7)); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil((((x-y)/86400000)+1)/7)}
function dayDate(i){let d=new Date(weekStart);d.setDate(d.getDate()+i);return d}
function init(){if(!profile){document.querySelector('#setup').classList.remove('hidden')}else{document.querySelector('#main').classList.remove('hidden');ensureWeek();render()}}
function saveSetup(){profile={name:setupName.value.trim(),pers:setupPers.value.trim(),daily:+setupDaily.value||8.5,threshold:+setupThreshold.value||6,spesen:+setupSpesen.value||12}; if(!profile.name)return alert('Bitte Monteur eingeben.');localStorage.setItem('jpr_profile',JSON.stringify(profile));setup.classList.add('hidden');main.classList.remove('hidden');ensureWeek();render()}
function shiftWeek(n){weekStart.setDate(weekStart.getDate()+7*n);selectedDay=0;ensureWeek();render()}
function totalDay(i,workOnly=false){return data[wkKey()].days[i].reduce((s,e)=>s+(workOnly&&e.special?0:+e.hours||0),0)}
function statusClass(i){if(i>4)return 'over';let t=totalDay(i);return t<profile.daily?'low':t>profile.daily?'over':'exact'}
function render(){ensureWeek();weekTitle.textContent=`KW ${kw(weekStart)} · ${fmtDate(dayDate(0))}–${fmtDate(dayDate(6))}`;dayTabs.innerHTML='';for(let i=0;i<5;i++)dayTabs.appendChild(dayButton(i));weekendTabs.innerHTML='';for(const i of data[wkKey()].weekends)weekendTabs.appendChild(dayButton(i));addWeekend.style.display=data[wkKey()].weekends.length===2?'none':'block';renderDay();renderReports()}
function dayButton(i){const b=document.createElement('div');b.className='day'+(selectedDay===i?' active':'');let t=totalDay(i);b.innerHTML=`<div class="dn">${DAYS[i].slice(0,2)}</div><div>${dayDate(i).getDate()}</div><div class="hours ${statusClass(i)}">${t?num(t)+' h':'—'}</div>`;b.onclick=()=>{selectedDay=i;render()};return b}
function chooseWeekend(){const opts=[5,6].filter(i=>!data[wkKey()].weekends.includes(i));modalCard.innerHTML=`<div class="row between"><h3>Arbeitstag hinzufügen</h3><button class="ghost small" onclick="closeModal()">✕</button></div>${opts.map(i=>`<button class="full secondary" style="margin-top:8px" onclick="addWeekendDay(${i})">${DAYS[i]} · ${fmtDate(dayDate(i))}</button>`).join('')}`;modal.classList.remove('hidden')}
function addWeekendDay(i){data[wkKey()].weekends.push(i);selectedDay=i;closeModal();save()}
function renderDay(){dayTitle.textContent=DAYS[selectedDay];dayDate.textContent=fmtDate(dayDate(selectedDay));entries.innerHTML='';const es=data[wkKey()].days[selectedDay];es.forEach((e,idx)=>entries.appendChild(entryNode(e,idx)));if(!es.length)entries.innerHTML='<p class="muted">Noch keine Einträge für diesen Tag.</p>';let t=totalDay(selectedDay),cls=statusClass(selectedDay);dayTotal.className='totalbar '+cls;let extra=selectedDay<5&&t>profile.daily?` · +${num(t-profile.daily)} h`:'';dayTotal.innerHTML=`<span>Total</span><span>${num(t)} h${extra}</span>`;renderSpesen()}
function entryNode(e,idx){const div=document.createElement('div');div.className='entry';const loc=e.local?'<span class="pill local">Lokal</span>':'';const sp=e.special?'<span class="pill">Spezial</span>':'';div.innerHTML=`<div class="row between"><div><strong>${esc(e.name)}</strong> ${loc}${sp}<div class="muted">${esc(e.nr)} · ${num(e.hours)} h · ${e.rate||100}%</div></div><div class="row"><button class="ghost small" onclick="editEntry(${idx})">Bearbeiten</button><button class="danger small" onclick="removeEntry(${idx})">Löschen</button></div></div>${(e.tasks||[]).map(t=>`<div class="taskline">• ${esc(taskText(t))}</div>`).join('')}`;return div}
function renderSpesen(){let work=totalDay(selectedDay,true),candidates=data[wkKey()].days[selectedDay].filter(e=>!e.special);spesenInfo.innerHTML='';if(work>=profile.threshold&&candidates.length){let sorted=[...candidates].sort((a,b)=>(+b.hours-+a.hours)||a.name.localeCompare(b.name,'de'));let target=sorted[0];let manual=data[wkKey()].spesenOverride?.[selectedDay];if(manual){let m=candidates.find(e=>e.uid===manual);if(m)target=m}spesenInfo.innerHTML=`<div class="spesen"><strong>Spesen CHF ${num(profile.spesen)}</strong> → ${esc(target.name)} <button class="ghost small" style="float:right" onclick="chooseSpesen()">Ändern</button><div style="clear:both"></div></div>`}}
function chooseSpesen(){const es=data[wkKey()].days[selectedDay].filter(e=>!e.special);modalCard.innerHTML=`<div class="row between"><h3>Spesen zuweisen</h3><button class="ghost small" onclick="closeModal()">✕</button></div>${es.map(e=>`<button class="full secondary" style="margin-top:8px" onclick="setSpesen('${e.uid}')">${esc(e.name)} · ${num(e.hours)} h</button>`).join('')}`;modal.classList.remove('hidden')}
function setSpesen(uid){data[wkKey()].spesenOverride=data[wkKey()].spesenOverride||{};data[wkKey()].spesenOverride[selectedDay]=uid;closeModal();save()}
function addEntry(){openEntryEditor(null)} function editEntry(i){openEntryEditor(i)}
function openEntryEditor(idx){const existing=idx===null?null:data[wkKey()].days[selectedDay][idx];let sites=[...OFFICIAL,...locals.map(x=>({...x,local:true})),...SPECIAL];modalCard.innerHTML=`<div class="row between"><h3>${existing?'Eintrag bearbeiten':'Baustelle / Spezial hinzufügen'}</h3><button class="ghost small" onclick="closeModal()">✕</button></div>
<label>Baustelle / Spezialcode</label><select id="eSite"><option value="">Bitte wählen…</option><optgroup label="Offizielle Baustellen">${OFFICIAL.map(s=>`<option value="${s.id}">${s.nr} · ${esc(s.name)}</option>`).join('')}</optgroup><optgroup label="Lokal gespeichert">${locals.map(s=>`<option value="${s.id}">${s.nr} · ${esc(s.name)}</option>`).join('')}</optgroup><optgroup label="Spezialcodes">${SPECIAL.map(s=>`<option value="${s.id}">${s.nr} · ${esc(s.name)}</option>`).join('')}</optgroup></select>
<button class="ghost small full" style="margin-top:8px" onclick="newLocalSite()">＋ Neue Baustelle</button>
<div class="grid2"><div><label>Stunden</label><input id="eHours" type="number" min="0" step="0.25" value="${existing?existing.hours:''}"></div><div><label>Stundenart</label><select id="eRate"><option>100</option><option>125</option><option>150</option><option>200</option></select></div></div>
<div id="taskArea"><label>Ausgeführte Arbeiten</label><div class="taskbuttons">${TASKS.map((t,i)=>`<button onclick="addTask(${i})">${esc(t)}</button>`).join('')}<button onclick="addFreeTask()">＋ Andere Arbeit</button></div><div id="taskList"></div></div>
<details style="margin-top:8px"><summary><strong>Weitere Angaben</strong></summary><div class="grid3"><div><label>Auto km</label><input id="eAuto" type="number" step="1" value="${existing?.auto||''}"></div><div><label>Töff km</label><input id="eToeff" type="number" step="1" value="${existing?.toeff||''}"></div><div><label>Andere Spesen CHF</label><input id="eOther" type="number" step="0.5" value="${existing?.other||''}"></div></div></details>
<button class="full" style="margin-top:14px" onclick="saveEntry(${idx===null?'null':idx})">Speichern</button>`;
modal.classList.remove('hidden');window._editTasks=existing?JSON.parse(JSON.stringify(existing.tasks||[])):[];if(existing){eSite.value=existing.siteId;eRate.value=existing.rate||100}eSite.onchange=toggleTaskArea;toggleTaskArea();renderTaskList()}
function toggleTaskArea(){const id=eSite.value;taskArea.style.display=id.startsWith('s-')?'none':'block'}
function addTask(i){window._editTasks.push({base:TASKS[i],detail:''});renderTaskList()} function addFreeTask(){window._editTasks.push({base:'',detail:''});renderTaskList()}
function renderTaskList(){taskList.innerHTML='';window._editTasks.forEach((t,i)=>{let d=document.createElement('div');d.className='taskitem';d.innerHTML=`<div class="row"><strong style="min-width:135px">${esc(t.base||'Andere Arbeit')}</strong><input placeholder="z.B. Haus A OG" value="${escAttr(t.detail||'')}" oninput="window._editTasks[${i}].detail=this.value"><button class="danger small" onclick="window._editTasks.splice(${i},1);renderTaskList()">✕</button></div>`;taskList.appendChild(d)})}
function newLocalSite(){modalCard.innerHTML=`<div class="row between"><h3>Neue Baustelle</h3><button class="ghost small" onclick="closeModal()">✕</button></div><label>Auftrags-Nr.</label><input id="newNr"><label>Baustelle</label><input id="newName"><div class="notice">Wird nur auf diesem Gerät gespeichert und als <strong>Lokal</strong> gekennzeichnet.</div><button class="full" onclick="saveLocalSite()">Speichern & verwenden</button>`}
function saveLocalSite(){let nr=newNr.value.trim(),name=newName.value.trim();if(!nr||!name)return alert('Nummer und Baustelle eingeben.');let s={id:'l-'+Date.now(),nr,name};locals.push(s);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));closeModal();openEntryEditor(null);setTimeout(()=>{eSite.value=s.id;toggleTaskArea()},0)}
function saveEntry(idx){let id=eSite.value;if(!id)return alert('Bitte Baustelle oder Spezialcode wählen.');let site=[...OFFICIAL,...locals,...SPECIAL].find(s=>s.id===id);let hours=+eHours.value;if(!hours)return alert('Bitte Stunden eingeben.');let e={uid:idx===null?'e'+Date.now():data[wkKey()].days[selectedDay][idx].uid,siteId:id,nr:site.nr,name:site.name,official:!!site.official,local:id.startsWith('l-'),special:id.startsWith('s-'),hours,rate:+eRate.value,tasks:id.startsWith('s-')?[]:window._editTasks,auto:+eAuto.value||0,toeff:+eToeff.value||0,other:+eOther.value||0};if(idx===null)data[wkKey()].days[selectedDay].push(e);else data[wkKey()].days[selectedDay][idx]=e;closeModal();save()}
function removeEntry(i){if(confirm('Eintrag löschen?')){data[wkKey()].days[selectedDay].splice(i,1);save()}}
function renderReports(){let map={};for(let d=0;d<7;d++)for(const e of data[wkKey()].days[d]){if(!map[e.siteId])map[e.siteId]={...e,days:{}};map[e.siteId].days[d]=(map[e.siteId].days[d]||[]).concat(e)}let vals=Object.values(map);reports.innerHTML=vals.length?vals.map((r,i)=>`<div class="entry row between"><div><strong>${esc(r.name)}</strong><div class="muted">${r.nr} · ${num(Object.values(r.days).flat().reduce((s,e)=>s+(+e.hours||0),0))} h</div></div><button class="small" onclick="printReport('${r.siteId}')">Rapport erstellen</button></div>`).join(''):'<p class="muted">Noch keine Rapporte in dieser Woche.</p>'}
function printReport(siteId){let site=null,byDay={};for(let d=0;d<7;d++){let es=data[wkKey()].days[d].filter(e=>e.siteId===siteId);if(es.length){site=es[0];byDay[d]=es}}if(!site)return;let month=dayDate(0).getMonth()+1,year=dayDate(0).getFullYear();let workRows='';for(let d=0;d<5;d++){let texts=(byDay[d]||[]).flatMap(e=>e.special?[e.name]:(e.tasks||[]).map(taskText));workRows+=`<div class="workrow"><div class="workday">${DAYS[d]}</div><div class="worktext">${texts.length?texts.map(esc).join('\n'):''}</div></div>`}
let rows='';for(let d=0;d<7;d++){if(!byDay[d])continue;for(const e of byDay[d]){let sp=getSpesenForEntry(d,e);rows+=`<tr><td>${fmtDate(dayDate(d)).slice(0,5)}</td><td>${e.rate===100?num(e.hours):''}</td><td>${e.rate===125?num(e.hours):''}</td><td>${e.rate===150?num(e.hours):''}</td><td>${e.rate===200?num(e.hours):''}</td><td>${sp?num(sp):''}</td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${e.other||''}</td></tr>`}}
printHost.innerHTML=`<div class="report"><div class="r-head"><div class="r-logo">J. PETER REICH AG<br><span>Elektroanlagen · Telekommunikation</span></div><div class="r-title">Rapport / Regiearbeiten</div><div class="r-meta"><div>Monat: <strong>${month}</strong></div><div>Jahr: <strong>${year}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div><div>Visum:</div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Auftrags-Nr.: <strong>${esc(site.nr)}</strong></div><div>Baustelle: <strong>${esc(site.name)}</strong></div><div>Architekt / Bauherr:</div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div>${workRows}</div><div class="r-section"><div class="r-section-title">Stundenkontrolle</div><table class="hours-table"><thead><tr><th>Datum</th><th>100%</th><th>125%</th><th>150%</th><th>200%</th><th>Zulagen</th><th>Auto km</th><th>Töff km</th><th>Spesen</th></tr></thead><tbody>${rows}</tbody></table></div><div class="r-note">Digital erstellt · KW ${kw(weekStart)}</div></div>`;setTimeout(()=>window.print(),80)}
function getSpesenForEntry(d,e){if(e.special)return 0;let work=totalDay(d,true);if(work<profile.threshold)return 0;let es=data[wkKey()].days[d].filter(x=>!x.special);let override=data[wkKey()].spesenOverride?.[d];let target=override?es.find(x=>x.uid===override):[...es].sort((a,b)=>(+b.hours-+a.hours)||a.name.localeCompare(b.name,'de'))[0];return target&&target.uid===e.uid?profile.spesen:0}
function showSettings(){if(!profile)return;modalCard.innerHTML=`<div class="row between"><h3>Einstellungen</h3><button class="ghost small" onclick="closeModal()">✕</button></div><div class="grid2"><div><label>Monteur</label><input id="sName" value="${escAttr(profile.name)}"></div><div><label>Pers.-Nr.</label><input id="sPers" value="${escAttr(profile.pers||'')}"></div></div><div class="grid3"><div><label>Tagesstunden</label><input id="sDaily" type="number" step=".25" value="${profile.daily}"></div><div><label>Spesen ab h</label><input id="sThreshold" type="number" step=".25" value="${profile.threshold}"></div><div><label>Spesen CHF</label><input id="sSpesen" type="number" step=".5" value="${profile.spesen}"></div></div><button class="full" style="margin-top:12px" onclick="saveSettings()">Speichern</button><hr style="border:0;border-top:1px solid #e5e7eb;margin:18px 0"><h3>Lokale Baustellen</h3>${locals.length?locals.map((s,i)=>`<div class="entry row between"><div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.nr)}</div></div><button class="danger small" onclick="deleteLocal(${i})">Löschen</button></div>`).join(''):'<p class="muted">Keine lokalen Baustellen.</p>'}<button class="ghost full" onclick="newLocalSite()">＋ Neue Baustelle</button>`;modal.classList.remove('hidden')}
function saveSettings(){profile={name:sName.value.trim(),pers:sPers.value.trim(),daily:+sDaily.value||8.5,threshold:+sThreshold.value||6,spesen:+sSpesen.value||12};localStorage.setItem('jpr_profile',JSON.stringify(profile));closeModal();render()}
function deleteLocal(i){if(confirm('Lokale Baustelle löschen? Bereits erfasste Rapporte bleiben erhalten.')){locals.splice(i,1);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));showSettings()}}
function closeModal(){modal.classList.add('hidden')}
function taskText(t){return [t.base,t.detail].filter(Boolean).join(', ')} function num(n){return (+n||0).toLocaleString('de-CH',{maximumFractionDigits:2})} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function escAttr(s){return esc(s)}
init();
</script>
</body>
</html>
