</style></head><body><header class="app-header"><div class="brand"><span>JPRAG Rapport</span></div></header><div class="wrap"><div id="setup" class="card hidden"><h2>Ersteinrichtung</h2><p class="muted">Diese Angaben werden nur lokal auf diesem Gerät gespeichert.</p><div class="grid2"><div><label>Monteur</label><input id="setupName"></div><div><label>Pers.-Nr.</label><input id="setupPers"></div></div><button class="full" style="margin-top:12px" onclick="saveSetup()">Speichern & starten</button></div><div id="main" class="hidden"><div class="weeknav"><button class="secondary" onclick="shiftWeek(-1)">‹</button><div class="weektitle"><div class="week-kw" id="weekKw"></div><div class="week-range" id="weekRange"></div></div><button class="secondary" onclick="shiftWeek(1)">›</button></div><div class="days" id="dayTabs"></div><div id="weekendTabs" class="days" style="grid-template-columns:repeat(2,1fr);margin-top:7px"></div><button id="addWeekend" class="ghost small full" style="margin:8px 0 12px" onclick="chooseWeekend()">＋ Arbeitstag hinzufügen</button><div class="card day-card"><div class="day-content-head"><div class="day-head-line"><h2 id="dayTitle"></h2><div class="muted" id="dayDateLabel"></div></div></div><div id="entries"></div><div id="dayAction"></div><div id="dayTotal" class="totalbar low"></div></div><div class="card report-actions">

</div><button class="settings-bottom" onclick="showSettings()">⚙ Einstellungen</button></div></div><div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div><div id="printHost"></div><script>
const OFFICIAL=[
['11122021','2 MFH Nänikon'],['11122047','1 MFH Überlandstr. 229, Dübendorf'],['11123036','NB Domum, Tagelswangen'],['11123042','NB Rubia, Russikon'],['11123051','NB 2MFH Rikonerstr. 1, Grafstal'],['11124019','NB Angst Hutzlenstr. 21, Volketswil'],['11124024','NB Untere Landstr., Ehrikon'],['11124026','Neubau Binzholz Wald'],['11124033','NB Grüningerstr. Ottikon'],['11124036','NB Gschwaderstr. Uster'],['11124042','NB Rebweg, Meilen'],['11124045','NB Abelia Ährenweg 11, Oerlikon'],['11125001','NB Kemptnerstr. Hinwil'],['11125002','NB Glatttalstr. Seebach'],['11125005','NB/UB Puurehuus Wermatswil'],['11125009','NB Russikerstr. Fehraltorf'],['11125011','NB Rebenstr. Effretikon'],['11125016','NB MFH Alte Landstr. Meilen'],['11125028','NB Obere Galtbergstr. 7, Gossau'],['11125030','NB Langrütistr. 20a, Dürnten'],['11125042','NB Oberackerstr. Breiti-Nürensdorf'],['11125046','UB Küsnachterstr. 25, Zumikon'],['11125049','NB Rennweg Theilingen'],['11125052','NB Strandbadstr. Wetzikon'],['11125057','NB Hofstetterstr. 62-66, Oberglatt'],['11125058','NB Arnold-Islerstr. Dübendorf'],['11125060','NB Zelgacherstr. 5, Hadlikon'],['11125062','NB Bachgasse 8, Uster'],['11125064','UB Erlengutstrasse 3, Erlenbach'],['11126003','NB Gupfen Illnau'],['11126006','NB Chapfstr. 8, Gossau'],['11126010','NB Tamarix, Tobeleggweg 32, Zürich'],['11126011','NB Angelica, Ackersteinstr. 141, Zürich'],['11126023','NB DEFH Saatwiesenstr. 17, Dübendorf']
].map(x=>({id:'o-'+x[0],nr:x[0],name:x[1],official:true}));
const SPECIAL=[['991','Direktverkauf'],['992','Kompensiert / Frei'],['993','Krankheit'],['994','Militär / Zivilschutz'],['995','Unbezahlt FREI/FERIEN'],['996','Unproduktive Arbeiten JPRAG'],['997','Ferien'],['998','Unfall'],['999','Schule + ÜK']].map(x=>({id:'s-'+x[0],nr:x[0],name:x[1],special:true}));
const TASKS=['Rohre einlegen','Wände einlegen','Dübeln','Spitzen / Gipsen / Verrohren (Rohbau)','Kabel / Drähte einziehen','Netzwerkkabel einziehen','Raumthermostat-Kabel einziehen','Dosen verdrahten','UV verdrahten','Geräte verdrahten','Netzwerk kontrollieren','Dosen stopfen','Lampen / Spots montieren','Fertigmontage'];const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
let profile=JSON.parse(localStorage.getItem('jpr_profile')||'null');let locals=JSON.parse(localStorage.getItem('jpr_local_sites')||'[]');let data=JSON.parse(localStorage.getItem('jpr_weeks')||'{}');let favorites=JSON.parse(localStorage.getItem('jpr_favorites')||'[]');let localTasks=JSON.parse(localStorage.getItem('jpr_local_tasks')||'[]');let taskFavorites=JSON.parse(localStorage.getItem('jpr_task_favorites')||'[]');let weekStart=getMonday(new Date()),selectedDay=0,editingIndex=null,selectedSite=null,editTasks=[],entryDraft=null,workPickerIndex=null,payrollMonth=getPayrollMonthForDate(new Date());
function getMonday(d){d=new Date(d);d.setHours(12,0,0,0);const n=d.getDay()||7;d.setDate(d.getDate()-n+1);return d}function iso(d){return d.toISOString().slice(0,10)}function wkKey(){return iso(weekStart)}function ensureWeek(){if(!data[wkKey()])data[wkKey()]={days:{},weekends:[],spesenOverride:{}};for(let i=0;i<7;i++)if(!data[wkKey()].days[i])data[wkKey()].days[i]=[]}function save(){localStorage.setItem('jpr_weeks',JSON.stringify(data));render()}function fmtDate(d){return new Intl.DateTimeFormat('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}function kw(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function dayDate(i){let d=new Date(weekStart);d.setDate(d.getDate()+i);return d}function num(n){return(+n||0).toLocaleString('de-CH',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function taskText(t){return[t.base,t.detail].filter(Boolean).join(', ')}function allSites(){return[...OFFICIAL,...locals.map(x=>({...x,local:true})),...SPECIAL]}function allTasks(){return[...TASKS.map((name,i)=>({id:'t-'+i,name,official:true})),...localTasks.map(x=>({...x,local:true}))]}function totalDay(i,workOnly=false){return data[wkKey()].days[i].reduce((s,e)=>s+(workOnly&&e.special?0:+e.hours||0),0)}function spesenValue(){let v=Number(profile?.spesen);return Number.isFinite(v)&&v>=0?v:12}function getPayrollMonthForDate(d){d=new Date(d);d.setHours(12,0,0,0);return new Date(d.getFullYear(),d.getMonth()+(d.getDate()>20?1:0),1,12)}function payrollBounds(m){let end=new Date(m.getFullYear(),m.getMonth(),20,23,59,59,999);let start=new Date(m.getFullYear(),m.getMonth()-1,21,0,0,0,0);return{start,end}}function shiftPayrollMonth(n){payrollMonth=new Date(payrollMonth.getFullYear(),payrollMonth.getMonth()+n,1,12);showHoursOverview()}function payrollSummary(m){let b=payrollBounds(m),work=0,specials={};for(const [key,w] of Object.entries(data)){let monday=new Date(key+'T12:00:00');if(Number.isNaN(monday.getTime()))continue;for(let d=0;d<7;d++){let dt=new Date(monday);dt.setDate(dt.getDate()+d);if(dt<b.start||dt>b.end)continue;for(const e of (w.days?.[d]||[])){let h=+e.hours||0;if(e.special){let k=e.nr||e.name;if(!specials[k])specials[k]={name:e.name||k,hours:0};specials[k].hours+=h}else work+=h}}}return{...b,work,specials:Object.values(specials).filter(x=>x.hours>0)}}function showHoursOverview(){modal.classList.remove('entry-mode');modal.classList.remove('report-mode');let r=payrollSummary(payrollMonth),monthName=MONTHS[payrollMonth.getMonth()]+' '+payrollMonth.getFullYear(),specialHtml=r.specials.length?`<div class="hours-specials">${r.specials.map(x=>`<div class="hours-special-row"><span>${esc(x.name)}</span><strong>${num(x.hours)}</strong></div>`).join('')}</div>`:'';modalCard.innerHTML=`<div class="hours-overview"><div class="hours-overview-nav"><button class="ghost small" onclick="closeModal()">← Zurück</button></div><div class="payroll-nav"><button class="secondary" onclick="shiftPayrollMonth(-1)">‹</button><div><div class="payroll-month">${monthName}</div><div class="payroll-range">${fmtDate(r.start)} – ${fmtDate(r.end)}</div></div><button class="secondary" onclick="shiftPayrollMonth(1)">›</button></div><div class="hours-main-card"><div class="field-kicker">Arbeitsstunden</div><div class="hours-main-number">${num(r.work)}</div></div>${specialHtml}</div>`;modal.classList.remove('hidden')}function init(){if(!profile){setup.classList.remove('hidden')}else{main.classList.remove('hidden');ensureWeek();render()}}function saveSetup(){profile={name:setupName.value.trim(),pers:setupPers.value.trim(),spesen:12};if(!profile.name)return alert('Bitte Monteur eingeben.');localStorage.setItem('jpr_profile',JSON.stringify(profile));setup.classList.add('hidden');main.classList.remove('hidden');ensureWeek();render()}function shiftWeek(n){weekStart.setDate(weekStart.getDate()+7*n);selectedDay=0;ensureWeek();render()}
function render(){ensureWeek();weekKw.textContent=`KW ${kw(weekStart)}`;weekRange.textContent=`${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}`;dayTabs.innerHTML='';for(let i=0;i<5;i++)dayTabs.appendChild(dayButton(i,false));weekendTabs.innerHTML='';for(const i of data[wkKey()].weekends)weekendTabs.appendChild(dayButton(i,true));addWeekend.style.display=data[wkKey()].weekends.length===2?'none':'block';renderDay()}function dayButton(i,optional){const b=document.createElement('div');b.className='day'+(selectedDay===i?' active':'');const dd=String(dayDate(i).getDate()).padStart(2,'0'),mm=String(dayDate(i).getMonth()+1).padStart(2,'0');b.innerHTML=`<div class="day-dow">${DAYS[i].slice(0,2).toUpperCase()}</div><div class="day-date-big">${dd}.${mm}</div>${optional?`<button class="weekend-remove" onclick="event.stopPropagation();removeWeekend(${i})">×</button>`:''}`;b.onclick=()=>{selectedDay=i;render()};return b}function chooseWeekend(){const opts=[5,6].filter(i=>!data[wkKey()].weekends.includes(i));modalCard.innerHTML=modalHead('Arbeitstag hinzufügen')+opts.map(i=>`<button class="full secondary" style="margin-top:8px" onclick="addWeekendDay(${i})">${DAYS[i]} · ${fmtDate(dayDate(i))}</button>`).join('');modal.classList.remove('hidden')}function addWeekendDay(i){data[wkKey()].weekends.push(i);selectedDay=i;closeModal();save()}function removeWeekend(i){const has=data[wkKey()].days[i].length;if(has&&!confirm(`${DAYS[i]} und alle Einträge löschen?`))return;if(has)data[wkKey()].days[i]=[];data[wkKey()].weekends=data[wkKey()].weekends.filter(x=>x!==i);if(selectedDay===i)selectedDay=0;save()}function renderDay(){dayTitle.textContent=DAYS[selectedDay];dayDateLabel.textContent=fmtDate(dayDate(selectedDay));const es=data[wkKey()].days[selectedDay];entries.innerHTML='';es.forEach((e,i)=>entries.appendChild(entryNode(e,i)));if(!es.length){dayAction.innerHTML=`<div class="empty-day"><button class="full capture-primary" onclick="openSitePicker()">＋ Arbeit erfassen</button></div>`;dayTotal.className='totalbar hidden';dayTotal.innerHTML='';}else{dayAction.innerHTML=`<button class="ghost full add-entry-inline" onclick="openSitePicker()">＋ Arbeit hinzufügen</button>`;let t=totalDay(selectedDay),cl=selectedDay<5?(t>=8?'ok':'low'):'ok';dayTotal.className='totalbar '+cl;dayTotal.innerHTML=`<span>Total</span><span>${num(t)}</span>`}}function entryNode(e,i){const d=document.createElement('div');d.className='entry';d.setAttribute('role','button');d.setAttribute('tabindex','0');let tasks=e.special?`<div class="taskline task-main">${esc(e.name)}</div>`:(e.tasks||[]).map(t=>`<div class="taskline"><span class="task-main">${esc(t.base)}</span>${t.detail?`<span class="task-detail">${esc(t.detail)}</span>`:''}</div>`).join('');d.innerHTML=`<div class="entry-head"><div style="min-width:0;flex:1"><div class="entry-name">${esc(e.name)} ${e.local?'<span class="pill local">Lokal</span>':''}</div>${tasks}</div><div class="entry-hours">${num(e.hours)}</div></div>`;d.onclick=()=>editEntry(i);d.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();editEntry(i)}};return d}function modalHead(t){modal.classList.remove('entry-mode');return`<div class="row between"><h3>${t}</h3><button class="ghost small" onclick="closeModal()">✕</button></div>`}function openSitePicker(){editingIndex=null;selectedSite=null;editTasks=[];entryDraft=null;renderSitePicker()}function renderSitePicker(q=''){modal.classList.remove('entry-mode');let query=q.trim().toLowerCase(),sites=allSites(),body='';if(query){let found=sites.filter(s=>(s.nr+' '+s.name).toLowerCase().includes(query));body=found.map(sitePickerRow).join('')||'<p class="muted">Keine Treffer.</p>'}else{let fav=favorites.map(id=>sites.find(s=>s.id===id)).filter(Boolean);if(fav.length)body+=`<div class="picker-section favorite-section"><div class="sectionlabel">Favoriten</div>${fav.map(sitePickerRow).join('')}</div>`;let rest=sites.filter(s=>!favorites.includes(s.id));body+=`<div class="picker-section all-section"><div class="sectionlabel">Alle Baustellen / Spezialcodes</div>${rest.map(sitePickerRow).join('')}</div>`}modalCard.innerHTML=modalHead('Baustelle / Spezial wählen')+`<div class="site-search"><input id="siteSearch" placeholder="Baustelle suchen · Name oder Auftrag-Nr." value="${esc(q)}" oninput="renderSitePicker(this.value);setTimeout(()=>{siteSearch.focus();siteSearch.setSelectionRange(siteSearch.value.length,siteSearch.value.length)},0)"></div><div id="siteResults">${body}</div><button class="ghost full" style="margin-top:10px" onclick="newLocalSite()">＋ Neue Baustelle hinzufügen</button>`;modal.classList.remove('hidden')}function sitePickerRow(site){let fav=favorites.includes(site.id);return`<div class="picker-row"><button class="picker-main" onclick="selectSite('${site.id}')"><strong>${esc(site.name)}</strong>${site.local?'<span class="pill local">Lokal</span>':''}<div class="muted picker-sub">${esc(site.nr)}</div></button><button class="picker-star ${fav?'is-fav':''}" aria-label="Favorit" onclick="toggleSiteFavorite('${site.id}')">${fav?'★':'☆'}</button></div>`}function toggleSiteFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('jpr_favorites',JSON.stringify(favorites));renderSitePicker(typeof siteSearch!=='undefined'?siteSearch.value:'')}function selectSite(id){selectedSite=allSites().find(s=>s.id===id);if(!selectedSite)return;entryDraft={hours:'',rate:100,auto:'',toeff:'',other:''};openEntryForm()}function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('jpr_favorites',JSON.stringify(favorites));openEntryForm()}
function editEntry(i){editingIndex=i;let e=data[wkKey()].days[selectedDay][i];selectedSite={id:e.siteId,nr:e.nr,name:e.name,special:e.special,local:e.local,official:e.official};editTasks=JSON.parse(JSON.stringify(e.tasks||[]));entryDraft={hours:e.hours||'',rate:e.rate||100,auto:e.auto||'',toeff:e.toeff||'',other:e.other||''};openEntryForm(e)}
function openEntryForm(existing=null){if(!selectedSite)return;let e=existing||(editingIndex!==null?data[wkKey()].days[selectedDay][editingIndex]:null);if(!entryDraft)entryDraft={hours:e?.hours||'',rate:e?.rate||100,auto:e?.auto||'',toeff:e?.toeff||'',other:e?.other||''};let isFav=favorites.includes(selectedSite.id);if(!e&&editingIndex===null&&!editTasks.length)editTasks=[];if(!selectedSite.special&&!editTasks.length)editTasks=[{base:'',detail:''}];modal.classList.remove('report-mode');modal.classList.add('entry-mode');modalCard.innerHTML=`<div class="entry-top"><div class="entry-title-group"><button class="fav-only ${isFav?'active':''}" aria-label="Favorit" onclick="toggleFavorite('${selectedSite.id}')">${isFav?'★':'☆'}</button><div class="entry-site-title">${esc(selectedSite.name)}</div></div><button class="close-light" aria-label="Schließen" onclick="closeModal()">×</button></div><div class="field-kicker">Stunden</div><div class="hoursline"><input id="eHours" class="hours-input" inputmode="decimal" type="number" min="0" step="0.25" value="${entryDraft.hours}" placeholder="0,0"><select id="eRate" class="rate-compact"><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></div>${selectedSite.special?'':`<div id="workBlocks"></div><button class="add-work full" onclick="addWorkBlock()">＋ Weitere Arbeit</button>`}<details class="more-details"><summary><strong>Weitere Angaben</strong></summary><div class="grid2"><div><label>Auto km</label><input id="eAuto" type="number" value="${entryDraft.auto||''}" placeholder="0"></div><div><label>Töff km</label><input id="eToeff" type="number" value="${entryDraft.toeff||''}" placeholder="0"></div></div><label>Andere Spesen CHF</label><input id="eOther" type="number" step="0.5" value="${entryDraft.other||''}" placeholder="0"></details><div class="screen-actions"><button class="full" onclick="saveEntry()">Speichern</button>${e?'<button class="danger full" style="margin-top:8px" onclick="removeEntry()">Eintrag löschen</button>':''}</div>`;modal.classList.remove('hidden');eRate.value=entryDraft.rate||100;if(!selectedSite.special)renderWorkBlocks()}
function syncEntryDraft(){if(typeof eHours!=='undefined')entryDraft={hours:eHours.value,rate:eRate.value,auto:typeof eAuto!=='undefined'?eAuto.value:'',toeff:typeof eToeff!=='undefined'?eToeff.value:'',other:typeof eOther!=='undefined'?eOther.value:''}}
function renderWorkBlocks(){workBlocks.innerHTML=editTasks.map((t,i)=>`<div class="workblock"><div class="field-kicker">Arbeit</div><div class="work-autocomplete"><input id="workInput${i}" class="work-input" autocomplete="off" value="${esc(t.base||'')}" placeholder="Arbeit eingeben…" onfocus="showWorkSuggestions(${i})" oninput="updateWorkInput(${i},this.value)"><div id="workSuggestions${i}" class="work-suggestions hidden"></div></div><div class="field-kicker description-kicker">Beschreibung</div><input class="work-desc" value="${esc(t.detail||'')}" placeholder="z. B. Haus A, OG" oninput="editTasks[${i}].detail=this.value">${editTasks.length>1?`<button class="work-remove" onclick="removeWorkBlock(${i})">Entfernen</button>`:''}</div>`).join('')}
function updateWorkInput(i,value){editTasks[i].base=value;renderWorkSuggestions(i,value)}
function showWorkSuggestions(i){renderWorkSuggestions(i,editTasks[i]?.base||'')}
function renderWorkSuggestions(i,q=''){let box=document.getElementById('workSuggestions'+i);if(!box)return;let query=q.trim().toLowerCase(),tasks=allTasks(),list=[];if(query){list=tasks.filter(t=>t.name.toLowerCase().includes(query)).slice(0,8)}else{list=taskFavorites.map(id=>tasks.find(t=>t.id===id)).filter(Boolean).slice(0,8)};let exact=query&&tasks.some(t=>t.name.toLowerCase()===query);let html='';if(!query&&list.length)html+=`<div class="suggest-label">Favoriten</div>`;html+=list.map(t=>workSuggestionRow(i,t)).join('');if(query&&!exact)html+=`<button class="new-work-suggestion" onclick="acceptTypedWork(${i})"><span>＋</span><div><strong>${esc(q.trim())}</strong><small>als lokale Arbeit verwenden</small></div></button>`;if(!html&&query)html=`<button class="new-work-suggestion" onclick="acceptTypedWork(${i})"><span>＋</span><div><strong>${esc(q.trim())}</strong><small>als lokale Arbeit verwenden</small></div></button>`;box.innerHTML=html;box.classList.toggle('hidden',!html)}
function workSuggestionRow(i,t){let fav=taskFavorites.includes(t.id);return`<div class="work-suggest-row ${t.local?'has-delete':''}"><button class="work-suggest-main" onclick="selectTaskFromInput(${i},'${t.id}')"><span>${esc(t.name)}</span>${t.local?'<small>Lokal</small>':''}</button><button class="work-suggest-star ${fav?'is-fav':''}" aria-label="Favorit" onclick="event.stopPropagation();toggleTaskFavoriteInline(${i},'${t.id}')">${fav?'★':'☆'}</button>${t.local?`<button class="work-suggest-delete" aria-label="Lokale Arbeit entfernen" title="Lokale Arbeit entfernen" onclick="event.stopPropagation();deleteLocalTask('${t.id}',${i})">×</button>`:''}</div>`}
function selectTaskFromInput(i,id){let t=allTasks().find(x=>x.id===id);if(!t)return;editTasks[i].base=t.name;let input=document.getElementById('workInput'+i);if(input)input.value=t.name;hideWorkSuggestions(i)}
function acceptTypedWork(i){let name=(editTasks[i]?.base||'').trim();if(!name)return;editTasks[i].base=name;ensureLocalTask(name);let input=document.getElementById('workInput'+i);if(input)input.value=name;hideWorkSuggestions(i)}
function hideWorkSuggestions(i){let box=document.getElementById('workSuggestions'+i);if(box)box.classList.add('hidden')}
function ensureLocalTask(name){name=(name||'').trim();if(!name)return;let exists=allTasks().some(t=>t.name.toLowerCase()===name.toLowerCase());if(!exists){localTasks.push({id:'lt-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),name,local:true});localStorage.setItem('jpr_local_tasks',JSON.stringify(localTasks))}}
function toggleTaskFavoriteInline(i,id){taskFavorites=taskFavorites.includes(id)?taskFavorites.filter(x=>x!==id):[...taskFavorites,id];localStorage.setItem('jpr_task_favorites',JSON.stringify(taskFavorites));renderWorkSuggestions(i,editTasks[i]?.base||'')}function deleteLocalTask(id,i){let t=localTasks.find(x=>x.id===id);if(!t)return;let used=false;for(const w of Object.values(data)){for(const es of Object.values(w.days||{})){if((es||[]).some(e=>(e.tasks||[]).some(x=>(x.base||'').trim().toLowerCase()===t.name.trim().toLowerCase()))){used=true;break}}if(used)break}let msg=used?'Arbeit aus Liste entfernen? Bereits erfasste Einträge bleiben erhalten.':'Lokale Arbeit aus Liste entfernen?';if(!confirm(msg))return;localTasks=localTasks.filter(x=>x.id!==id);taskFavorites=taskFavorites.filter(x=>x!==id);localStorage.setItem('jpr_local_tasks',JSON.stringify(localTasks));localStorage.setItem('jpr_task_favorites',JSON.stringify(taskFavorites));renderWorkSuggestions(i,editTasks[i]?.base||'')}
function addWorkBlock(){syncEntryDraft();editTasks.push({base:'',detail:''});renderWorkBlocks();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),0)}function removeWorkBlock(i){editTasks.splice(i,1);if(!editTasks.length)editTasks=[{base:'',detail:''}];renderWorkBlocks()}
function taskText(t){let base=t.base==='Andere Arbeit'?(t.custom||'Andere Arbeit'):t.base;return[base,t.detail].filter(Boolean).join(', ')}
function saveEntry(){syncEntryDraft();let hours=+entryDraft.hours;if(!hours)return alert('Bitte Stunden eingeben.');let cleaned=selectedSite.special?[]:editTasks.filter(t=>t.base&&t.base.trim()).map(t=>({...t,base:t.base.trim(),detail:(t.detail||'').trim()}));if(!selectedSite.special&&!cleaned.length)return alert('Bitte mindestens eine Arbeit eingeben.');cleaned.forEach(t=>ensureLocalTask(t.base));let old=editingIndex!==null?data[wkKey()].days[selectedDay][editingIndex]:null;let e={uid:old?.uid||'e'+Date.now(),siteId:selectedSite.id,nr:selectedSite.nr,name:selectedSite.name,official:!!selectedSite.official,local:!!selectedSite.local,special:!!selectedSite.special,hours,rate:+entryDraft.rate,tasks:cleaned,auto:+entryDraft.auto||0,toeff:+entryDraft.toeff||0,other:+entryDraft.other||0};if(editingIndex===null)data[wkKey()].days[selectedDay].push(e);else data[wkKey()].days[selectedDay][editingIndex]=e;entryDraft=null;closeModal();save()}function removeEntry(){if(confirm('Eintrag löschen?')){data[wkKey()].days[selectedDay].splice(editingIndex,1);closeModal();save()}}
function newLocalSite(){modalCard.innerHTML=modalHead('Neue Baustelle')+'<label>Auftrags-Nr.</label><input id="newNr"><label>Baustelle</label><input id="newName"><p class="muted">Wird lokal auf diesem Gerät gespeichert.</p><button class="full" onclick="saveLocalSite()">Speichern & verwenden</button>'}function saveLocalSite(){let nr=newNr.value.trim(),name=newName.value.trim();if(!nr||!name)return alert('Nummer und Baustelle eingeben.');let s={id:'l-'+Date.now(),nr,name,local:true};locals.push(s);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));selectedSite=s;entryDraft={hours:'',rate:100,auto:'',toeff:'',other:''};openEntryForm()}
function getSpesenTarget(d){let es=data[wkKey()].days[d].filter(e=>!e.special),work=es.reduce((s,e)=>s+(+e.hours||0),0);if(work<6||!es.length)return null;let override=data[wkKey()].spesenOverride?.[d];if(override){let m=es.find(e=>e.uid===override);if(m)return m}return[...es].sort((a,b)=>(+b.hours-+a.hours)||a.name.localeCompare(b.name,'de'))[0]}function getSpesenForEntry(d,e){let t=getSpesenTarget(d);return t&&t.uid===e.uid?spesenValue():0}
function weeklyRows(htmlForPrint=false){let rows='',weekTotal=0;for(let d=0;d<7;d++){let es=data[wkKey()].days[d];if(!es.length)continue;let dt=totalDay(d);weekTotal+=dt;es.forEach((e,j)=>{let acts=e.special?e.name:(e.tasks||[]).map(taskText).join(' · ');let dayCell=j===0?`<td rowspan="${es.length}"><div class="con-day">${DAYS[d]}</div><div class="con-date">${fmtDate(dayDate(d))}</div><div class="con-total">${num(dt)} Std.</div></td>`:'';rows+=`<tr class="${j===0?'day-start':''}">${dayCell}<td>${esc(e.nr)}</td><td>${esc(e.name)}</td><td>${esc(acts)}</td><td>${num(e.hours)}</td><td>${getSpesenForEntry(d,e)?num(getSpesenForEntry(d,e)):''}</td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${e.other||''}</td></tr>`})}return{rows,weekTotal}}
function weeklyBySiteBlocks(){
  let groups=new Map(),weekTotal=0;
  for(let d=0;d<7;d++){
    let es=data[wkKey()].days[d]||[];
    for(const e of es){
      weekTotal+=+e.hours||0;
      if(!groups.has(e.siteId))groups.set(e.siteId,{siteId:e.siteId,name:e.name,nr:e.nr,special:e.special,days:new Map(),total:0});
      let g=groups.get(e.siteId),day=g.days.get(d)||{entries:[],hours:0,spesen:0,auto:0,toeff:0,other:0};
      day.entries.push(e);
      day.hours+=+e.hours||0;
      day.spesen+=getSpesenForEntry(d,e)||0;
      day.auto+=+e.auto||0;
      day.toeff+=+e.toeff||0;
      day.other+=+e.other||0;
      g.total+=+e.hours||0;
      g.days.set(d,day);
    }
  }
  let html='';
  for(const g of groups.values()){
    let dayHtml='';
    for(const [d,day] of [...g.days.entries()].sort((a,b)=>a[0]-b[0])){
      let tasks=[];
      for(const e of day.entries){
        if(e.special)tasks.push(`<div class="site-day-task"><strong>${esc(e.name)}</strong></div>`);
        else for(const t of (e.tasks||[]))tasks.push(`<div class="site-day-task"><strong>${esc(t.base)}</strong>${t.detail?`<span>${esc(t.detail)}</span>`:''}</div>`);
      }
      let extras=[];
      if(day.spesen)extras.push(`<span class="spesen-chip">Spesen ${num(day.spesen)} CHF</span>`);
      if(day.auto)extras.push(`Auto ${num(day.auto)} km`);
      if(day.toeff)extras.push(`Töff ${num(day.toeff)} km`);
      if(day.other)extras.push(`Div. Spesen ${num(day.other)} CHF`);
      dayHtml+=`<div class="site-day-row"><div class="site-day-top"><div><div class="site-day-label">${DAYS[d]}</div><span class="site-day-date">${fmtDate(dayDate(d))}</span></div><div class="site-day-hours">${num(day.hours)}</div></div>${tasks.join('')}${extras.length?`<div class="mobile-extras">${extras.map(x=>x.startsWith('<span')?x:`<span>${x}</span>`).join('')}</div>`:''}</div>`;
    }
    html+=`<section class="site-week-block"><div class="site-week-head"><div class="site-week-name">${esc(g.name)}</div><div class="site-week-order">Auftrag-Nr. ${esc(g.nr)}</div></div>${dayHtml}<div class="site-week-footer"><span>Total Baustelle</span><strong>${num(g.total)}</strong></div></section>`;
  }
  return{html,weekTotal};
}
function showWeeklyBySite(){
  let r=weeklyBySiteBlocks();
  modal.classList.remove('entry-mode');
  modal.classList.add('report-mode');
  modalCard.innerHTML=`<div class="report-screen"><div class="report-screen-nav"><button class="ghost small" onclick="closeModal()">← Zurück</button></div><div class="mobile-report-header"><div class="mobile-report-title">Wochenbericht nach Baustellen</div><div>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</div><div class="muted">${esc(profile.name)}${profile.pers?` · Pers.-Nr. ${esc(profile.pers)}`:''} · KW ${kw(weekStart)}</div></div>${r.html||'<div class="card"><p class="muted">Keine Einträge.</p></div>'}<div class="mobile-week-total"><span>Wochenstunden</span><strong>${num(r.weekTotal)} Std.</strong></div><div class="report-send"><button class="full" onclick="printWeeklyBySite()">Bericht senden</button></div></div>`;
  modal.classList.remove('hidden');
}
function printWeeklyBySite(){
  let groups=new Map(),weekTotal=0;
  for(let d=0;d<7;d++){
    for(const e of data[wkKey()].days[d]){
      let key=e.siteId||`${e.nr}|${e.name}`;
      if(!groups.has(key))groups.set(key,{name:e.name,nr:e.nr,total:0,days:new Map()});
      let g=groups.get(key),day=g.days.get(d)||{hours:0,entries:[],spesen:0,auto:0,toeff:0,other:0};
      day.entries.push(e);day.hours+=+e.hours||0;day.spesen+=getSpesenForEntry(d,e)||0;day.auto+=+e.auto||0;day.toeff+=+e.toeff||0;day.other+=+e.other||0;
      g.total+=+e.hours||0;weekTotal+=+e.hours||0;g.days.set(d,day);
    }
  }
  let blocks='';
  for(const g of groups.values()){
    let days='';
    for(const [d,day] of [...g.days.entries()].sort((a,b)=>a[0]-b[0])){
      let works=[];
      for(const e of day.entries){
        if(e.special)works.push(`<div><strong>${esc(e.name)}</strong></div>`);
        else for(const t of (e.tasks||[]))works.push(`<div><strong>${esc(t.base)}</strong>${t.detail?` · ${esc(t.detail)}`:''}</div>`);
      }
      let extras=[];
      if(day.spesen)extras.push(`<div class="site-print-extra spesen">Spesen ${num(day.spesen)} CHF</div>`);
      if(day.auto)extras.push(`<div class="site-print-extra">Auto ${num(day.auto)} km</div>`);
      if(day.toeff)extras.push(`<div class="site-print-extra">Töff ${num(day.toeff)} km</div>`);
      if(day.other)extras.push(`<div class="site-print-extra">Div. Spesen ${num(day.other)} CHF</div>`);
      days+=`<div class="site-print-day"><div class="site-print-date">${DAYS[d]}<span>${fmtDate(dayDate(d))}</span></div><div class="site-print-work">${works.join('')}${extras.join('')}</div><div class="site-print-hours">${num(day.hours)}</div></div>`;
    }
    blocks+=`<div class="site-print-block"><div class="site-print-head"><div class="site-print-name">${esc(g.name)}</div><div class="site-print-order">Auftrag-Nr. ${esc(g.nr)}</div></div>${days}<div class="site-print-total"><span>Total Baustelle</span><span>${num(g.total)}</span></div></div>`;
  }
  printHost.innerHTML=`<div class="report"><div class="r-head"><div class="r-logo pdf-logo"><img src="logo-neu.png" alt="J. Peter Reich AG"></div><div class="r-title">Wochenbericht nach Baustellen</div><div class="r-meta"><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Woche: <strong>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</strong></div></div>${blocks||'<p>Keine Einträge.</p>'}<div class="r-note" style="display:flex;justify-content:space-between"><span>Digital erstellt · KW ${kw(weekStart)}</span><strong>Wochenstunden: ${num(weekTotal)} Std.</strong></div></div>`;
  setTimeout(()=>window.print(),80);
}
function weeklyMobileBlocks(){let out='',weekTotal=0;for(let d=0;d<7;d++){let es=data[wkKey()].days[d];if(!es.length)continue;let dt=totalDay(d);weekTotal+=dt;out+=`<section class="week-day-block"><div class="week-day-head"><div><strong>${DAYS[d]}</strong><span>${fmtDate(dayDate(d))}</span></div><div class="week-day-total">${num(dt)} Std.</div></div>`;for(const e of es){let sp=getSpesenForEntry(d,e),tasks=e.special?`<div class="mobile-task">${esc(e.name)}</div>`:(e.tasks||[]).map(t=>`<div class="mobile-task"><strong>${esc(t.base)}</strong>${t.detail?`<span>${esc(t.detail)}</span>`:''}</div>`).join('');let extras=[];if(sp)extras.push(`Spesen ${num(sp)} CHF`);if(e.auto)extras.push(`Auto ${num(e.auto)} km`);if(e.toeff)extras.push(`Töff ${num(e.toeff)} km`);if(e.other)extras.push(`Div. Spesen ${num(e.other)} CHF`);out+=`<div class="mobile-report-row"><div class="mobile-report-top"><div><div class="mobile-site">${esc(e.name)}</div><div class="mobile-order">${esc(e.nr)}</div></div><div class="mobile-hours">${num(e.hours)}</div></div>${tasks}${extras.length?`<div class="mobile-extras">${extras.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>`}out+='</section>'}return{html:out,weekTotal}}function showWeeklyReport(){let r=weeklyMobileBlocks(),m=dayDate(0).getMonth(),y=dayDate(0).getFullYear();modal.classList.remove('entry-mode');modal.classList.add('report-mode');modalCard.innerHTML=`<div class="report-screen"><div class="report-screen-nav"><button class="ghost small" onclick="closeModal()">← Zurück</button></div><div class="mobile-report-header"><div class="mobile-report-title">Wochenbericht nach Tagen</div><div>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</div><div class="muted">${esc(profile.name)}${profile.pers?` · Pers.-Nr. ${esc(profile.pers)}`:''} · KW ${kw(weekStart)}</div></div>${r.html||'<div class="card"><p class="muted">Keine Einträge.</p></div>'}<div class="mobile-week-total"><span>Wochenstunden</span><strong>${num(r.weekTotal)} Std.</strong></div><div class="report-send"><button class="full" onclick="printWeeklyReport()">Wochenbericht senden</button></div></div>`;modal.classList.remove('hidden')}function printWeeklyReport(){let r=weeklyRows(true),m=dayDate(0).getMonth(),y=dayDate(0).getFullYear();printHost.innerHTML=`<div class="report consolidated"><div class="r-head"><div class="r-logo pdf-logo"><img src="logo-neu.png" alt="J. Peter Reich AG"></div><div class="r-title">Wochenbericht</div><div class="r-meta"><div>Monat: <strong>${m+1} – ${MONTHS[m]}</strong></div><div>Jahr: <strong>${y}</strong></div><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Woche: <strong>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</strong></div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div><table class="hours-table consolidated-table"><thead><tr><th>Tag</th><th>Auftrag-Nr.</th><th>Baustelle</th><th>Ausgeführte Arbeiten</th><th>Std.</th><th>Spesen</th><th>Auto km</th><th>Töff km</th><th>Div. Spesen</th></tr></thead><tbody>${r.rows}</tbody></table></div><div class="r-note" style="display:flex;justify-content:space-between"><span>Digital erstellt · KW ${kw(weekStart)}</span><strong>Wochenstunden: ${num(r.weekTotal)} Std.</strong></div></div>`;setTimeout(()=>window.print(),80)}function showSiteReports(){let map={};for(let d=0;d<7;d++)for(const e of data[wkKey()].days[d]){if(!map[e.siteId])map[e.siteId]={...e,total:0};map[e.siteId].total+=+e.hours||0}let vals=Object.values(map);modalCard.innerHTML=modalHead('Baustellenberichte')+(vals.length?vals.map(r=>`<div class="entry row between"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.nr)} · ${num(r.total)}</div></div><button class="small" onclick="printReport('${r.siteId}')">Rapport erstellen</button></div>`).join(''):'<p class="muted">Noch keine Rapporte in dieser Woche.</p>');modal.classList.remove('hidden')}function printReport(siteId){let site=null,byDay={};for(let d=0;d<7;d++){let es=data[wkKey()].days[d].filter(e=>e.siteId===siteId);if(es.length){site=es[0];byDay[d]=es}}if(!site)return;let m=dayDate(0).getMonth(),y=dayDate(0).getFullYear(),workRows='';for(let d=0;d<7;d++){if(d>4&&!byDay[d])continue;let texts=(byDay[d]||[]).flatMap(e=>e.special?[e.name]:(e.tasks||[]).map(taskText));workRows+=`<div class="workrow"><div class="workday">${DAYS[d]}</div><div class="worktext">${texts.map(esc).join('\n')}</div></div>`}let rows='';for(let d=0;d<7;d++)for(const e of(byDay[d]||[]))rows+=`<tr><td>${fmtDate(dayDate(d)).slice(0,5)}</td><td>${e.rate===100?num(e.hours):''}</td><td>${e.rate===125?num(e.hours):''}</td><td>${e.rate===150?num(e.hours):''}</td><td>${e.rate===200?num(e.hours):''}</td><td></td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${(getSpesenForEntry(d,e)||0)+(e.other||0)||''}</td></tr>`;printHost.innerHTML=`<div class="report"><div class="r-head"><div class="r-logo pdf-logo"><img src="logo-neu.png" alt="J. Peter Reich AG"></div><div class="r-title">Rapport / Regiearbeiten</div><div class="r-meta"><div>Monat: <strong>${m+1} – ${MONTHS[m]}</strong></div><div>Jahr: <strong>${y}</strong></div><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Auftrags-Nr.: <strong>${esc(site.nr)}</strong></div><div>Baustelle: <strong>${esc(site.name)}</strong></div><div>Architekt / Bauherr:</div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div>${workRows}</div><div class="r-section"><div class="r-section-title">Stundenkontrolle</div><table class="hours-table"><thead><tr><th>Datum</th><th>100%</th><th>125%</th><th>150%</th><th>200%</th><th>Zulagen</th><th>Auto km</th><th>Töff km</th><th>Spesen</th></tr></thead><tbody>${rows}</tbody></table></div><div class="r-note">Digital erstellt · KW ${kw(weekStart)}</div></div>`;setTimeout(()=>window.print(),80)}
function showSettings(){modal.classList.remove('report-mode');modal.classList.remove('entry-mode');modalCard.innerHTML=modalHead('Einstellungen')+`<div class="grid2"><div><label>Monteur</label><input id="sName" value="${esc(profile.name)}"></div><div><label>Pers.-Nr.</label><input id="sPers" value="${esc(profile.pers||'')}"></div></div><div style="margin-top:12px"><label>Spesen pro Tag (CHF)</label><input id="sSpesen" type="number" min="0" step="0.5" value="${spesenValue()}"><p class="muted" style="font-size:12px">Wird automatisch ab 6 Arbeitsstunden der Baustelle mit den meisten Stunden zugeordnet.</p></div><p class="muted">Tageskontrolle: fest 8 Std.</p><button class="full" onclick="saveSettings()">Speichern</button>`;modal.classList.remove('hidden')}function saveSettings(){profile={...profile,name:sName.value.trim(),pers:sPers.value.trim(),spesen:Math.max(0,Number(sSpesen.value)||0)};localStorage.setItem('jpr_profile',JSON.stringify(profile));closeModal();render()}function deleteLocal(i){if(confirm('Lokale Baustelle löschen? Bereits erfasste Rapporte bleiben erhalten.')){locals.splice(i,1);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));showSettings()}}function closeModal(){modal.classList.add('hidden');modal.classList.remove('entry-mode');modal.classList.remove('report-mode');entryDraft=null;editTasks=[];workPickerIndex=null}init();
</script></body></html>
