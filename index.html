function newLocalSite(){modalCard.innerHTML=modalHead('Neue Baustelle')+'<label>Auftrags-Nr.</label><input id="newNr"><label>Baustelle</label><input id="newName"><p class="muted">Wird lokal auf diesem Gerät gespeichert.</p><button class="full" onclick="saveLocalSite()">Speichern & verwenden</button>'}function saveLocalSite(){let nr=newNr.value.trim(),name=newName.value.trim();if(!nr||!name)return alert('Nummer und Baustelle eingeben.');let s={id:'l-'+Date.now(),nr,name,local:true};locals.push(s);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));selectedSite=s;entryDraft={hours:'',rate:100,auto:'',toeff:'',other:''};openEntryForm()}
function getSpesenTarget(d){let es=data[wkKey()].days[d].filter(e=>!e.special),work=es.reduce((s,e)=>s+(+e.hours||0),0);if(work<6||!es.length)return null;let override=data[wkKey()].spesenOverride?.[d];if(override){let m=es.find(e=>e.uid===override);if(m)return m}return[...es].sort((a,b)=>(+b.hours-+a.hours)||a.name.localeCompare(b.name,'de'))[0]}function getSpesenForEntry(d,e){let t=getSpesenTarget(d);return t&&t.uid===e.uid?spesenValue():0}
function weeklyRows(htmlForPrint=false){let rows='',weekTotal=0;for(let d=0;d<7;d++){let es=data[wkKey()].days[d];if(!es.length)continue;let dt=totalDay(d);weekTotal+=dt;es.forEach((e,j)=>{let acts=e.special?e.name:(e.tasks||[]).map(taskText).join(' · ');let dayCell=j===0?`<td rowspan="${es.length}"><div class="con-day">${DAYS[d]}</div><div class="con-date">${fmtDate(dayDate(d))}</div><div class="con-total">${num(dt)} Std.</div></td>`:'';rows+=`<tr class="${j===0?'day-start':''}">${dayCell}<td>${esc(e.nr)}</td><td>${esc(e.name)}</td><td>${esc(acts)}</td><td>${num(e.hours)}</td><td>${getSpesenForEntry(d,e)?num(getSpesenForEntry(d,e)):''}</td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${e.other||''}</td></tr>`})}return{rows,weekTotal}}
function weeklyBySiteBlocks(){
  let groups=new Map(),weekTotal=0;
  for(let d=0;d<7;d++){
    let es=data[wkKey()].days[d]||[];
    for(const e of es){
      weekTotal+=+e.hours||0;
      if(!groups.has(e.siteId))groups.set(e.siteId,{siteId:e.siteId,name:e.name,nr:e.nr,special:e.special,days:new Map(),total:0});
      let g=groups.get(e.siteId),day=g.days.get(d)||{entries:[],hours:0,spesen:0,auto:0,toeff:0,other:0};
      day.entries.push(e);
      day.hours+=+e.hours||0;
      day.spesen+=getSpesenForEntry(d,e)||0;
      day.auto+=+e.auto||0;
      day.toeff+=+e.toeff||0;
      day.other+=+e.other||0;
      g.total+=+e.hours||0;
      g.days.set(d,day);
    }
  }
  let html='';
  for(const g of groups.values()){
    let dayHtml='';
    for(const [d,day] of [...g.days.entries()].sort((a,b)=>a[0]-b[0])){
      let tasks=[];
      for(const e of day.entries){
        if(e.special)tasks.push(`<div class="site-day-task"><strong>${esc(e.name)}</strong></div>`);
        else for(const t of (e.tasks||[]))tasks.push(`<div class="site-day-task"><strong>${esc(t.base)}</strong>${t.detail?`<span>${esc(t.detail)}</span>`:''}</div>`);
      }
      let extras=[];
      if(day.spesen)extras.push(`<span class="spesen-chip">Spesen ${num(day.spesen)} CHF</span>`);
      if(day.auto)extras.push(`Auto ${num(day.auto)} km`);
      if(day.toeff)extras.push(`Töff ${num(day.toeff)} km`);
      if(day.other)extras.push(`Div. Spesen ${num(day.other)} CHF`);
      dayHtml+=`<div class="site-day-row"><div class="site-day-top"><div><div class="site-day-label">${DAYS[d]}</div><span class="site-day-date">${fmtDate(dayDate(d))}</span></div><div class="site-day-hours">${num(day.hours)}</div></div>${tasks.join('')}${extras.length?`<div class="mobile-extras">${extras.map(x=>x.startsWith('<span')?x:`<span>${x}</span>`).join('')}</div>`:''}</div>`;
    }
    html+=`<section class="site-week-block"><div class="site-week-head"><div class="site-week-name">${esc(g.name)}</div><div class="site-week-order">Auftrag-Nr. ${esc(g.nr)}</div></div>${dayHtml}<div class="site-week-footer"><span>Total Baustelle</span><strong>${num(g.total)}</strong></div></section>`;
  }
  return{html,weekTotal};
}
function showWeeklyBySite(){
  let r=weeklyBySiteBlocks();

  modal.classList.add('report-mode');
  modalCard.innerHTML=`<div class="report-screen"><div class="report-screen-nav"><button class="ghost small" onclick="closeModal()">← Zurück</button></div><div class="mobile-report-header"><div class="mobile-report-title">Wochenbericht nach Baustellen</div><div>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</div><div class="muted">${esc(profile.name)}${profile.pers?` · Pers.-Nr. ${esc(profile.pers)}`:''} · KW ${kw(weekStart)}</div></div>${r.html||'<div class="card"><p class="muted">Keine Einträge.</p></div>'}<div class="mobile-week-total"><span>Wochenstunden</span><strong>${num(r.weekTotal)} Std.</strong></div><div class="report-send"><button class="full" onclick="printWeeklyBySite()">Bericht senden</button></div></div>`;
  modal.classList.remove('hidden');
}
function printWeeklyBySite(){
  let groups=new Map(),weekTotal=0;
  for(let d=0;d<7;d++){
    for(const e of data[wkKey()].days[d]){
      let key=e.siteId||`${e.nr}|${e.name}`;
      if(!groups.has(key))groups.set(key,{name:e.name,nr:e.nr,total:0,days:new Map()});
      let g=groups.get(key),day=g.days.get(d)||{hours:0,entries:[],spesen:0,auto:0,toeff:0,other:0};
      day.entries.push(e);day.hours+=+e.hours||0;day.spesen+=getSpesenForEntry(d,e)||0;day.auto+=+e.auto||0;day.toeff+=+e.toeff||0;day.other+=+e.other||0;
      g.total+=+e.hours||0;weekTotal+=+e.hours||0;g.days.set(d,day);
    }
  }
  let blocks='';
  for(const g of groups.values()){
    let rows='';
    for(const [d,day] of [...g.days.entries()].sort((a,b)=>a[0]-b[0])){
      let works=[];
      for(const e of day.entries){
        if(e.special)works.push(`<div><strong>${esc(e.name)}</strong></div>`);
        else for(const t of (e.tasks||[]))works.push(`<div><strong>${esc(t.base)}</strong>${t.detail?` · ${esc(t.detail)}`:''}</div>`);
      }
      let extras=[];
      if(day.spesen)extras.push(`<span class="pdf-spesen">Spesen ${num(day.spesen)} CHF</span>`);
      if(day.auto)extras.push(`<div class="pdf-extra">Auto ${num(day.auto)} km</div>`);
      if(day.toeff)extras.push(`<div class="pdf-extra">Töff ${num(day.toeff)} km</div>`);
      if(day.other)extras.push(`<div class="pdf-extra">Div. Spesen ${num(day.other)} CHF</div>`);
      rows+=`<div class="pdf-row pdf-site-row"><div class="pdf-day-cell"><strong>${DAYS[d]}</strong><span>${fmtDate(dayDate(d))}</span></div><div class="pdf-work-cell">${works.join('')}${extras.join('')}</div><div class="pdf-hours-cell">${num(day.hours)}</div></div>`;
    }
    blocks+=`<section class="pdf-block"><div class="pdf-block-head"><div class="pdf-block-title">${esc(g.name)}</div><div class="pdf-block-sub">Auftrag-Nr. ${esc(g.nr)}</div></div>${rows}<div class="pdf-block-total"><span>Total Baustelle</span><span>${num(g.total)}</span></div></section>`;
  }
  printHost.innerHTML=`<div class="report pdf-weekly">${weeklyPdfHeader('Wochenbericht nach Baustellen')}${blocks||'<p>Keine Einträge.</p>'}<div class="pdf-week-note"><span>Digital erstellt · KW ${kw(weekStart)}</span><strong>Wochenstunden: ${num(weekTotal)} Std.</strong></div></div>`;
  printWithFilename(weeklyFilename('Baustellen'));
}
function weeklyMobileBlocks(){
  let out='',weekTotal=0;
  for(let d=0;d<7;d++){

function showWeeklyReport(){
  let r=weeklyMobileBlocks();
  modal.classList.remove('entry-mode');modal.classList.add('report-mode');
  modalCard.innerHTML=`<div class="report-screen"><div class="report-screen-nav"><button class="ghost small" onclick="closeModal()">← Zurück</button></div><div class="mobile-report-header"><div class="mobile-report-title">Wochenbericht nach Tagen</div><div>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</div><div class="muted">${esc(profile.name)}${profile.pers?` · Pers.-Nr. ${esc(profile.pers)}`:''} · KW ${kw(weekStart)}</div></div>${r.html||'<div class="card"><p class="muted">Keine Einträge.</p></div>'}<div class="mobile-week-total"><span>Wochenstunden</span><strong>${num(r.weekTotal)} Std.</strong></div><div class="report-send"><button class="full" onclick="printWeeklyReport()">Bericht senden</button></div></div>`;

function cleanFilePart(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'')}
function weeklyFilename(type){let pers=cleanFilePart(profile.pers||'PersNr'),name=cleanFilePart(profile.name||'Monteur'),year=dayDate(0).getFullYear();return `${pers}_${name}_KW${kw(weekStart)}_${year}_${type}`}
function waitForPrintImages(){
  const imgs=[...printHost.querySelectorAll('img')];
  if(!imgs.length)return Promise.resolve();
  return Promise.all(imgs.map(img=>{
    if(img.complete&&img.naturalWidth>0)return Promise.resolve();
    return new Promise(resolve=>{
      const done=()=>resolve();
      img.addEventListener('load',done,{once:true});
      img.addEventListener('error',done,{once:true});
      setTimeout(done,2500);
    });
  }));
}
function printWithFilename(name){
  let old=document.title;
  document.title=name;
  let restore=()=>{document.title=old;window.removeEventListener('afterprint',restore)};
  window.addEventListener('afterprint',restore);
  waitForPrintImages().then(()=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
  });
  setTimeout(()=>{if(document.title===name)document.title=old},7000);
}
function weeklyPdfHeader(title){return `<div class="r-head"><div class="r-logo pdf-logo"><img src="${JPRAG_LOGO_DATA}" alt="J. Peter Reich AG"></div><div class="r-title">${title}</div><div class="r-meta"><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Woche: <strong>${fmtDate(dayDate(0))} – ${fmtDate(dayDate(6))}</strong></div></div>`}
function printWeeklyReport(){
  let blocks='',weekTotal=0;
  for(let d=0;d<7;d++){
    let es=data[wkKey()].days[d];if(!es.length)continue;
    let dt=totalDay(d);weekTotal+=dt;let rows='';
    for(const e of es){
      let works=[];
      if(e.special)works.push(`<div><strong>${esc(e.name)}</strong></div>`);else for(const t of (e.tasks||[]))works.push(`<div><strong>${esc(t.base)}</strong>${t.detail?` · ${esc(t.detail)}`:''}</div>`);
      let extras=[],sp=getSpesenForEntry(d,e);
      if(sp)extras.push(`<span class="pdf-spesen">Spesen ${num(sp)} CHF</span>`);
      if(e.auto)extras.push(`<div class="pdf-extra">Auto ${num(e.auto)} km</div>`);
      if(e.toeff)extras.push(`<div class="pdf-extra">Töff ${num(e.toeff)} km</div>`);

      rows+=`<div class="pdf-row pdf-day-row"><div class="pdf-site-cell"><div class="pdf-site-name">${esc(e.name)}</div><div class="pdf-order">Auftrag-Nr. ${esc(e.nr)}</div></div><div class="pdf-work-cell">${works.join('')}${extras.join('')}</div><div class="pdf-hours-cell">${num(e.hours)}</div></div>`;
    }
    blocks+=`<section class="pdf-block"><div class="pdf-block-head"><div class="pdf-block-title">${DAYS[d]}</div><div class="pdf-block-sub">${fmtDate(dayDate(d))}</div></div>${rows}<div class="pdf-block-total"><span>Total Tag</span><span>${num(dt)}</span></div></section>`;
  }
  printHost.innerHTML=`<div class="report pdf-weekly">${weeklyPdfHeader('Wochenbericht nach Tagen')}${blocks||'<p>Keine Einträge.</p>'}<div class="pdf-week-note"><span>Digital erstellt · KW ${kw(weekStart)}</span><strong>Wochenstunden: ${num(weekTotal)} Std.</strong></div></div>`;
  printWithFilename(weeklyFilename('Tage'));
}
function showSiteReports(){let map={};for(let d=0;d<7;d++)for(const e of data[wkKey()].days[d]){if(!map[e.siteId])map[e.siteId]={...e,total:0};map[e.siteId].total+=+e.hours||0}let vals=Object.values(map);modalCard.innerHTML=modalHead('Baustellenberichte')+(vals.length?vals.map(r=>`<div class="entry row between"><div><strong>${esc(r.name)}</strong><div class="muted">${esc(r.nr)} · ${num(r.total)}</div></div><button class="small" onclick="printReport('${r.siteId}')">Rapport erstellen</button></div>`).join(''):'<p class="muted">Noch keine Rapporte in dieser Woche.</p>');modal.classList.remove('hidden')}function printReport(siteId){let site=null,byDay={};for(let d=0;d<7;d++){let es=data[wkKey()].days[d].filter(e=>e.siteId===siteId);if(es.length){site=es[0];byDay[d]=es}}if(!site)return;let m=dayDate(0).getMonth(),y=dayDate(0).getFullYear(),workRows='';for(let d=0;d<7;d++){if(d>4&&!byDay[d])continue;let texts=(byDay[d]||[]).flatMap(e=>e.special?[e.name]:(e.tasks||[]).map(taskText));workRows+=`<div class="workrow"><div class="workday">${DAYS[d]}</div><div class="worktext">${texts.map(esc).join('\n')}</div></div>`}let rows='';for(let d=0;d<7;d++)for(const e of(byDay[d]||[]))rows+=`<tr><td>${fmtDate(dayDate(d)).slice(0,5)}</td><td>${e.rate===100?num(e.hours):''}</td><td>${e.rate===125?num(e.hours):''}</td><td>${e.rate===150?num(e.hours):''}</td><td>${e.rate===200?num(e.hours):''}</td><td></td><td>${e.auto||''}</td><td>${e.toeff||''}</td><td>${(getSpesenForEntry(d,e)||0)+(e.other||0)||''}</td></tr>`;printHost.innerHTML=`<div class="report"><div class="r-head"><div class="r-logo pdf-logo"><img src="${JPRAG_LOGO_DATA}" alt="J. Peter Reich AG"></div><div class="r-title">Rapport / Regiearbeiten</div><div class="r-meta"><div>Monat: <strong>${m+1} – ${MONTHS[m]}</strong></div><div>Jahr: <strong>${y}</strong></div><div>KW: <strong>${kw(weekStart)}</strong></div><div>Pers.-Nr.: <strong>${esc(profile.pers||'')}</strong></div></div></div><div class="r-info"><div>Monteur: <strong>${esc(profile.name)}</strong></div><div>Auftrags-Nr.: <strong>${esc(site.nr)}</strong></div><div>Baustelle: <strong>${esc(site.name)}</strong></div><div>Architekt / Bauherr:</div></div><div class="r-section"><div class="r-section-title">Ausgeführte Arbeiten</div>${workRows}</div><div class="r-section"><div class="r-section-title">Stundenkontrolle</div><table class="hours-table"><thead><tr><th>Datum</th><th>100%</th><th>125%</th><th>150%</th><th>200%</th><th>Zulagen</th><th>Auto km</th><th>Töff km</th><th>Spesen</th></tr></thead><tbody>${rows}</tbody></table></div><div class="r-note">Digital erstellt · KW ${kw(weekStart)}</div></div>`;waitForPrintImages().then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>window.print())))}
function showSettings(){modal.classList.remove('report-mode');modal.classList.remove('entry-mode');modalCard.innerHTML=modalHead('Einstellungen')+`<div class="grid2"><div><label>Monteur</label><input id="sName" value="${esc(profile.name)}"></div><div><label>Pers.-Nr.</label><input id="sPers" value="${esc(profile.pers||'')}"></div></div><div style="margin-top:12px"><label>Spesen pro Tag (CHF)</label><input id="sSpesen" type="number" min="0" step="0.5" value="${spesenValue()}"><p class="muted" style="font-size:12px">Wird automatisch ab 6 Arbeitsstunden der Baustelle mit den meisten Stunden zugeordnet.</p></div><p class="muted">Tageskontrolle: fest 8 Std.</p><button class="full" onclick="saveSettings()">Speichern</button>`;modal.classList.remove('hidden')}function saveSettings(){profile={...profile,name:sName.value.trim(),pers:sPers.value.trim(),spesen:Math.max(0,Number(sSpesen.value)||0)};localStorage.setItem('jpr_profile',JSON.stringify(profile));closeModal();render()}function deleteLocal(i){if(confirm('Lokale Baustelle löschen? Bereits erfasste Rapporte bleiben erhalten.')){locals.splice(i,1);localStorage.setItem('jpr_local_sites',JSON.stringify(locals));showSettings()}}function closeModal(){modal.classList.add('hidden');modal.classList.remove('entry-mode');modal.classList.remove('report-mode');entryDraft=null;editTasks=[];workPickerIndex=null}init();
</script></body></html>
